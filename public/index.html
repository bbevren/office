<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; height: 100vh; overflow: hidden; }
        
        /* Editor fills entire viewport */
        #editor { width: 100%; height: 100%; position: relative; }
        #editor iframe { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: none; }
        
        /* Small floating buttons - bottom right */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 5px;
            display: flex;
            flex-direction: row;
            gap: 8px;
            z-index: 10000;
        }
        
        .fab {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            transition: all 0.2s ease;
            position: relative;
        }
        
        /* Document type colors matching OnlyOffice toolbar */
        .fab-container[data-doc-type="word"] .fab { background: #446995; }
        .fab-container[data-doc-type="word"] .fab:hover { background: #3a5a82; }
        .fab-container[data-doc-type="cell"] .fab { background: #3A8056; }
        .fab-container[data-doc-type="cell"] .fab:hover { background: #2f6a47; }
        .fab-container[data-doc-type="slide"] .fab { background: #B75B44; }
        .fab-container[data-doc-type="slide"] .fab:hover { background: #a04d38; }
        
        .fab:hover {
            transform: translateY(-2px);
        }
        
        .fab svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        
        /* Dropdown */
        .fab-dropdown {
            position: absolute;
            bottom: 44px;
            right: 0;
            background: #2d2d2d;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            min-width: 160px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(5px);
            transition: all 0.2s ease;
            overflow: hidden;
        }
        
        .fab:hover .fab-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
        
        .dropdown-item {
            padding: 10px 14px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            transition: background 0.15s ease;
        }
        
        .dropdown-item:hover { background: rgba(255,255,255,0.1); }
        .dropdown-item-icon { font-size: 14px; width: 20px; text-align: center; opacity: 0.8; }
        .dropdown-divider { height: 1px; background: rgba(255,255,255,0.1); }
        .dropdown-filename { padding: 8px 12px; }
        .dropdown-filename input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 12px;
            outline: none;
        }
        .dropdown-filename input:focus { border-color: rgba(255,255,255,0.4); }
        
        /* Hidden file input */
        #file-input { display: none; }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 13px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 30000;
        }
        .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: #c0392b; }
        .toast.success { background: #27ae60; }
    </style>
</head>
<body>
    <div id="editor"></div>
    
    <!-- Small floating buttons -->
    <div class="fab-container" id="fab-container" data-doc-type="word">
        <!-- New document -->
        <button class="fab" title="New">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 9h-2v2H9v-2H7v-2h2V7h2v2h2v2zm0-6V3.5L18.5 9H13z"/></svg>
            <div class="fab-dropdown">
                <div class="dropdown-item" onclick="createDocument('word')"><span class="dropdown-item-icon">📝</span>Document</div>
                <div class="dropdown-item" onclick="createDocument('cell')"><span class="dropdown-item-icon">📊</span>Spreadsheet</div>
                <div class="dropdown-item" onclick="createDocument('slide')"><span class="dropdown-item-icon">📽️</span>Presentation</div>
                <div class="dropdown-divider"></div>
                <div class="dropdown-item" onclick="document.getElementById('file-input').click()"><span class="dropdown-item-icon">📂</span>Open file...</div>
            </div>
        </button>
        
        <!-- Download -->
        <button class="fab" title="Download" id="download-btn">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <div class="fab-dropdown" id="download-dropdown"></div>
        </button>
    </div>
    
    <input type="file" id="file-input" accept=".docx,.doc,.xlsx,.xls,.pptx,.ppt,.odt,.ods,.odp,.rtf,.txt,.csv,.html,.md">
    <div class="toast" id="toast"></div>
    
    <script src="/onlyoffice/v8/web-apps/apps/api/documents/api.js"></script>
    <script>
        // ============================================
        // STATE
        // ============================================
        let editor = null;
        let currentType = 'word';
        let currentDocUrl = null;
        let currentDocBlob = null;
        let currentFileName = 'Untitled';
        let documentChanges = [];
        let currentDocumentImages = {};
        
        const GLOBAL_USER_ID = 'user_' + Math.random().toString(36).substr(2, 9);
        const EmptyDocTemplates = { word: null, cell: null, slide: null };
        
        // AMD loader
        window.define = function(factory) { window._lastAMDModule = factory(); };
        window.define.amd = true;
        
        const EXT_MAP = { word: 'docx', cell: 'xlsx', slide: 'pptx' };
        const TYPE_MAP = {
            docx: 'word', doc: 'word', odt: 'word', rtf: 'word', txt: 'word', html: 'word', md: 'word',
            xlsx: 'cell', xls: 'cell', ods: 'cell', csv: 'cell',
            pptx: 'slide', ppt: 'slide', odp: 'slide', pdf: 'word'
        };
        
        const DOWNLOAD_FORMATS = {
            word: [
                { ext: 'docx', label: 'Word (.docx)' },
                { ext: 'pdf', label: 'PDF (.pdf)' },
                { ext: 'odt', label: 'ODT (.odt)' },
                { ext: 'rtf', label: 'RTF (.rtf)' },
                { ext: 'txt', label: 'Text (.txt)' }
            ],
            cell: [
                { ext: 'xlsx', label: 'Excel (.xlsx)' },
                { ext: 'pdf', label: 'PDF (.pdf)' },
                { ext: 'ods', label: 'ODS (.ods)' },
                { ext: 'csv', label: 'CSV (.csv)' }
            ],
            slide: [
                { ext: 'pptx', label: 'PowerPoint (.pptx)' },
                { ext: 'pdf', label: 'PDF (.pdf)' },
                { ext: 'odp', label: 'ODP (.odp)' }
            ]
        };
        
        // ============================================
        // TEMPLATES
        // ============================================
        async function loadTemplates() {
            const configs = [
                { type: 'word', path: '/templates/oodoc_base.js' },
                { type: 'cell', path: '/templates/oocell_base.js' },
                { type: 'slide', path: '/templates/ooslide_base.js' }
            ];
            for (const cfg of configs) {
                try {
                    await new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = cfg.path;
                        script.onload = () => {
                            if (window._lastAMDModule) {
                                EmptyDocTemplates[cfg.type] = window._lastAMDModule(true) || window._lastAMDModule();
                                window._lastAMDModule = null;
                            }
                            resolve();
                        };
                        script.onerror = reject;
                        document.head.appendChild(script);
                    });
                } catch (e) { console.error('Template load error:', e); }
            }
            console.log('[Templates] Loaded');
        }
        
        // ============================================
        // UI
        // ============================================
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' visible';
            setTimeout(() => t.classList.remove('visible'), 3000);
        }
        
        function updateToolbarColor() {
            const container = document.getElementById('fab-container');
            if (container) container.setAttribute('data-doc-type', currentType);
        }
        
        function updateDownloadOptions() {
            const container = document.getElementById('download-dropdown');
            const formats = DOWNLOAD_FORMATS[currentType] || DOWNLOAD_FORMATS.word;
            const defaultName = currentFileName || 'Untitled';
            container.innerHTML = `
                <div class="dropdown-filename">
                    <input type="text" id="download-filename" value="${defaultName}" placeholder="Filename">
                </div>
                <div class="dropdown-divider"></div>
            ` + formats.map(f => 
                `<div class="dropdown-item" onclick="downloadAs('${f.ext}')"><span class="dropdown-item-icon">📥</span>${f.label}</div>`
            ).join('');
            updateToolbarColor();
        }

        // ============================================
        // EDITOR
        // ============================================
        function destroyEditor() {
            if (currentDocUrl) { URL.revokeObjectURL(currentDocUrl); currentDocUrl = null; }
            if (editor) { try { editor.destroyEditor(); } catch(e){} editor = null; }
            document.getElementById('editor').innerHTML = '';
            currentDocBlob = null;
            documentChanges = [];
        }
        
        async function createDocument(type) {
            destroyEditor();
            
            // Wait for template
            let attempts = 0;
            while (!EmptyDocTemplates[type] && attempts < 50) {
                await new Promise(r => setTimeout(r, 100));
                attempts++;
            }
            if (!EmptyDocTemplates[type]) { showToast('Template not loaded', 'error'); return; }
            
            currentType = type;
            currentDocBlob = new Blob([EmptyDocTemplates[type]], { type: 'text/plain' });
            currentDocUrl = URL.createObjectURL(currentDocBlob);
            
            initEditor(document.getElementById('filename')?.value || 'Untitled');
            updateDownloadOptions();
        }
        
        async function openFile(file) {
            destroyEditor();
            
            const ext = file.name.split('.').pop().toLowerCase();
            currentType = TYPE_MAP[ext] || 'word';
            const filename = file.name.replace(/\.[^/.]+$/, '');
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const response = await fetch('/api/open', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/octet-stream', 'X-File-Extension': ext },
                    body: arrayBuffer
                });
                if (!response.ok) throw new Error('Server error');
                const result = await response.json();
                if (result.error) throw new Error(result.error);
                
                currentDocBlob = new Blob([result.data], { type: 'text/plain' });
                currentDocUrl = URL.createObjectURL(currentDocBlob);
                currentDocumentImages = result.images || {};
                
                initEditor(filename);
                updateDownloadOptions();
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        }
        
        async function openFromUrl(filePath) {
            destroyEditor();
            
            try {
                let fileUrl = filePath.startsWith('http') || filePath.startsWith('/') ? filePath : '/samples/' + encodeURIComponent(filePath);
                const response = await fetch(fileUrl);
                if (!response.ok) throw new Error('File not found');
                
                const arrayBuffer = await response.arrayBuffer();
                const fileName = filePath.split('/').pop();
                const ext = fileName.split('.').pop().toLowerCase();
                
                currentType = TYPE_MAP[ext] || 'word';
                
                const convertResponse = await fetch('/api/open', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/octet-stream', 'X-File-Extension': ext },
                    body: arrayBuffer
                });
                if (!convertResponse.ok) throw new Error('Conversion error');
                const result = await convertResponse.json();
                
                currentDocBlob = new Blob([result.data], { type: 'text/plain' });
                currentDocUrl = URL.createObjectURL(currentDocBlob);
                currentDocumentImages = result.images || {};
                
                initEditor(fileName.replace(/\.[^/.]+$/, ''));
                updateDownloadOptions();
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                createDocument('word'); // Fallback
            }
        }
        
        function initEditor(filename) {
            currentFileName = filename;
            const fileType = EXT_MAP[currentType];
            
            const config = {
                documentType: currentType === 'cell' ? 'spreadsheet' : currentType === 'slide' ? 'presentation' : 'word',
                document: {
                    fileType: fileType,
                    key: 'doc_' + Date.now(),
                    title: filename + '.' + fileType,
                    url: currentDocUrl,
                    permissions: { edit: true, download: true, print: true, review: false, comment: false }
                },
                editorConfig: {
                    mode: 'edit',
                    lang: 'en',
                    user: { id: GLOBAL_USER_ID, name: 'User' },
                    coEditing: { mode: 'fast', change: false },
                    customization: {
                        autosave: false, forcesave: false, chat: false, comments: false,
                        compactHeader: true, compactToolbar: false, help: false,
                        hideRightMenu: false, about: false, feedback: false
                    }
                },
                events: {
                    onAppReady: () => console.log('[Editor] Ready'),
                    onDocumentReady: () => { 
                        console.log('[Editor] Document ready'); 
                        setupIframe(); 
                        // Disable lock mechanism after document loads
                        setTimeout(disableLockMechanism, 100);
                        setTimeout(disableLockMechanism, 500);
                        setTimeout(disableLockMechanism, 1500);
                    },
                    onError: (e) => { if (!window._downloadInProgress) console.error('[Editor] Error:', e); },
                    onDownloadAs: (e) => {
                        console.log('[Editor] onDownloadAs:', e);
                        if (e?.data?.url || e?.data) triggerFileDownload(e.data.url || e.data);
                    }
                },
                type: 'desktop',
                width: '100%',
                height: '100%'
            };
            
            editor = new DocsAPI.DocEditor('editor', config);
            
            if (editor.connectMockServer) {
                connectMockServer(editor);
            }
        }
        
        // ============================================
        // MOCK SERVER - Fast single-user mode
        // Handles OnlyOffice collaborative protocol in single-user mode
        // Key: All locks are granted to GLOBAL_USER_ID so editor sees them as "mine"
        // ============================================
        function connectMockServer(editorInstance) {
            window.APP = window.APP || {};
            let sendToEditor = null;
            
            const mockServer = {
                onMessage: function(msg) {
                    // Handle getLock - CRITICAL for preventing lock UI
                    // By returning locks owned by GLOBAL_USER_ID, editor thinks "I own this"
                    if (msg.type === 'getLock') {
                        const locks = {};
                        (msg.block || []).forEach(block => {
                            const key = typeof block === 'object' ? JSON.stringify(block) : String(block);
                            locks[key] = { 
                                visitable: true, 
                                block: block, 
                                user: GLOBAL_USER_ID,  // Same as editor config user
                                time: Date.now(), 
                                changes: null,
                                sessionId: GLOBAL_USER_ID
                            };
                        });
                        sendToEditor?.({ type: 'getLock', locks: locks });
                        return;
                    }
                    
                    // Handle releaseLock - acknowledge release
                    if (msg.type === 'releaseLock') {
                        sendToEditor?.({ type: 'releaseLock', locks: {} });
                        return;
                    }
                    
                    // Handle saveChanges
                    if (msg.type === 'saveChanges') {
                        if (msg.changes) documentChanges = documentChanges.concat(msg.changes);
                        sendToEditor?.({ type: 'saveChanges', changesIndex: documentChanges.length, locks: [], excelAdditionalInfo: null });
                        return;
                    }
                    
                    // Handle unSaveLock
                    if (msg.type === 'unSaveLock') {
                        sendToEditor?.({ type: 'unSaveLock', index: -1 });
                        return;
                    }
                    
                    // Handle isSaveLock - always say NOT locked
                    if (msg.type === 'isSaveLock') {
                        sendToEditor?.({ type: 'saveLock', saveLock: false });
                        return;
                    }
                    
                    // Handle image URL requests
                    if (msg.type === 'openDocument' && msg.message?.c === 'imgurls') {
                        sendToEditor?.({ type: 'documentOpen', data: { imgurls: {} } });
                        return;
                    }
                },
                
                // Single-user mode: return EMPTY participant list
                // This tells the editor there's no one else to coordinate/lock with
                getParticipants: () => ({ list: [], index: -1 }),
                
                // CRITICAL: onAuth is called after connection - force fast mode here
                onAuth: function() {
                    console.log('[MockServer] Auth completed - forcing fast mode');
                    // Force fast mode to prevent lock visualization
                    window.APP.isFast = true;
                    if (typeof window.APP.onFastChange === 'function') {
                        window.APP.onFastChange(true);
                    }
                    // Also try to disable locks immediately
                    setTimeout(disableLockMechanism, 50);
                },
                
                getImageURL: (name) => {
                    if (name.startsWith('blob:') || name.startsWith('data:') || name.startsWith('http')) return Promise.resolve(name);
                    if (currentDocumentImages[name]) return Promise.resolve(currentDocumentImages[name]);
                    return Promise.resolve(`/onlyoffice/v8/web-apps/apps/documenteditor/main/${name}`);
                },
                
                getInitialChanges: () => [],
                
                onDocumentBinaryReady: (binary) => { 
                    window.currentDocumentBinary = binary; 
                }
            };
            
            try {
                sendToEditor = editorInstance.connectMockServer(mockServer);
                console.log('[MockServer] Connected successfully');
            } catch (e) { 
                console.error('[MockServer] Error:', e); 
            }
        }
        
        // ============================================
        // IFRAME SETUP
        // ============================================
        function setupIframe() {
            // Retry until iframe is fully accessible
            let retries = 0;
            const maxRetries = 30;
            
            function trySetup() {
                retries++;
                const iframe = document.querySelector('iframe[name="frameEditor"]') || document.querySelector('#editor iframe');
                console.log(`[Iframe] Setup attempt ${retries}, iframe found:`, !!iframe);
                
                if (!iframe) {
                    if (retries < maxRetries) setTimeout(trySetup, 500);
                    return;
                }
                
                const win = iframe.contentWindow;
                if (!win || !win.document || !win.document.head) {
                    console.log('[Iframe] contentWindow not ready yet');
                    if (retries < maxRetries) setTimeout(trySetup, 500);
                    return;
                }
                
                // Wait for document to be fully loaded
                if (win.document.readyState !== 'complete') {
                    console.log('[Iframe] Document not complete yet:', win.document.readyState);
                    if (retries < maxRetries) setTimeout(trySetup, 500);
                    return;
                }
                
                // Inject CSS into main editor iframe
                try {
                    // Check if already injected
                    if (!win.document.querySelector('link[href="/iframe-styles.css"]')) {
                        const link = win.document.createElement('link');
                        link.rel = 'stylesheet';
                        link.href = '/iframe-styles.css';
                        win.document.head.appendChild(link);
                        console.log('[Iframe] Injected styles into main iframe');
                    }
                    
                    // Also check for nested iframe (OnlyOffice may have inner iframe)
                    const innerIframe = win.document.querySelector('iframe');
                    if (innerIframe?.contentWindow?.document?.head) {
                        if (!innerIframe.contentWindow.document.querySelector('link[href="/iframe-styles.css"]')) {
                            const innerLink = innerIframe.contentWindow.document.createElement('link');
                            innerLink.rel = 'stylesheet';
                            innerLink.href = '/iframe-styles.css';
                            innerIframe.contentWindow.document.head.appendChild(innerLink);
                            console.log('[Iframe] Injected styles into nested iframe');
                        }
                    }
                } catch (e) {
                    console.error('[Iframe] Style injection failed:', e.message);
                    if (retries < maxRetries) setTimeout(trySetup, 500);
                    return;
                }
                
                // Patch XHR for download
                if (!win._xhrPatched) {
                    const OrigXHR = win.XMLHttpRequest;
                    win.XMLHttpRequest = function() {
                        const xhr = new OrigXHR();
                        const origOpen = xhr.open;
                        xhr.open = function(method, url, ...rest) {
                            if (method === 'POST' && url.includes('/downloadas/')) {
                                console.log('[XHR] Download request');
                                window._downloadInProgress = true;
                                pollForDownload();
                            }
                            return origOpen.call(this, method, url, ...rest);
                        };
                        return xhr;
                    };
                    win._xhrPatched = true;
                }
                
                // Disable locks
                try {
                    const ac = win.AscCommon;
                    if (ac?.g_oCollaborativeEditing) {
                        const ce = ac.g_oCollaborativeEditing;
                        ce.m_bFast = true;
                        ce.m_bSingleUser = true;
                        ce.Is_Fast = () => true;
                        ce.Is_SingleUser = () => true;
                    }
                } catch (e) {}
                
                // Also call full disableLockMechanism on the iframe window
                disableLockMechanism(win);
                
                console.log('[Iframe] Setup complete');
            }
            
            // Start after a longer delay to let iframe fully initialize
            setTimeout(trySetup, 2000);
        }
        
        // ============================================
        // DOWNLOAD
        // ============================================
        function downloadAs(format) {
            if (!editor) { showToast('No document', 'error'); return; }
            
            // Get filename from input
            const filenameInput = document.getElementById('download-filename');
            if (filenameInput && filenameInput.value) {
                currentFileName = filenameInput.value;
            }
            
            // For PDF, use our custom PDF generation
            if (format === 'pdf') {
                downloadAsPdf();
                return;
            }
            
            window._downloadInProgress = true;
            try {
                editor.downloadAs(format);
                pollForDownload();
            } catch (e) {
                showToast('Download failed', 'error');
                window._downloadInProgress = false;
            }
        }

        async function downloadAsPdf() {
            // Use OnlyOffice's print function which generates pdfbin and calls APP.printPdf
            showToast('Generating PDF...');
            try {
                // Debug: list all iframes
                const allIframes = document.querySelectorAll('iframe');
                console.log('[DownloadPDF] All iframes in document:', allIframes.length);
                allIframes.forEach((f, i) => console.log(`  [${i}] id="${f.id}" name="${f.name}" class="${f.className}"`));
                
                // Try multiple iframe selectors
                let iframe = document.querySelector('#editor iframe');
                if (!iframe) iframe = document.querySelector('iframe[name="frameEditor"]');
                if (!iframe) iframe = document.querySelector('iframe');
                
                console.log('[DownloadPDF] Selected iframe:', !!iframe, iframe?.name || 'no name');
                
                if (iframe && iframe.contentWindow) {
                    const win = iframe.contentWindow;
                    console.log('[DownloadPDF] contentWindow accessible');
                    
                    // Method 1: Click the print button in the toolbar (most reliable)
                    try {
                        const printBtn = win.document.querySelector('#id-toolbar-btn-print');
                        console.log('[DownloadPDF] Print button found:', !!printBtn);
                        if (printBtn) {
                            printBtn.click();
                            return;
                        }
                    } catch (e) {
                        console.log('[DownloadPDF] Button click failed:', e.message);
                    }
                    
                    // Method 2: Try the internal editor API
                    try {
                        const api = win.Asc?.editor || win.editor || win.editorCell;
                        console.log('[DownloadPDF] API found:', !!api);
                        if (api && typeof api.asc_Print === 'function') {
                            api.asc_Print();
                            return;
                        }
                    } catch (e) {
                        console.log('[DownloadPDF] API call failed:', e.message);
                    }
                    
                    // Method 3: Simulate Ctrl+P keyboard shortcut
                    try {
                        console.log('[DownloadPDF] Trying Ctrl+P simulation');
                        const event = new win.KeyboardEvent('keydown', {
                            key: 'p',
                            code: 'KeyP',
                            keyCode: 80,
                            which: 80,
                            ctrlKey: true,
                            bubbles: true,
                            cancelable: true
                        });
                        win.document.body.dispatchEvent(event);
                        return;
                    } catch (e) {
                        console.log('[DownloadPDF] Keyboard simulation failed:', e.message);
                    }
                }
            } catch (e) {
                console.error('[DownloadPDF] Error:', e);
            }
            
            // Final fallback: just tell user to use Ctrl+P
            showToast('Press Ctrl+P to print/save as PDF', 'error');
        }
        
        async function pollForDownload() {
            let attempts = 0;
            const maxAttempts = 20; // 10 seconds max
            
            while (attempts < maxAttempts && window._downloadInProgress) {
                attempts++;
                await new Promise(r => setTimeout(r, 500));
                try {
                    const res = await fetch('/api/latest-download');
                    const data = await res.json();
                    if (data.ready && data.url) {
                        await triggerFileDownload(data.url);
                        return;
                    }
                } catch (e) {}
            }
            
            // Timeout - stop polling
            if (window._downloadInProgress) {
                window._downloadInProgress = false;
                showToast('Download timeout - try again', 'error');
            }
        }
        
        async function triggerFileDownload(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const blob = await response.blob();
                
                // Get extension from URL, use currentFileName for the base name
                const urlFileName = url.split('/').pop() || 'download';
                const ext = urlFileName.includes('.') ? '.' + urlFileName.split('.').pop() : '';
                const fileName = currentFileName + ext;
                
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                showToast('Downloaded: ' + fileName);
                window._downloadInProgress = false;
            } catch (e) {
                showToast('Download failed', 'error');
                window._downloadInProgress = false;
            }
        }
        
        // ============================================
        // URL PARAMS & INIT
        // ============================================
        function handleUrlParams() {
            const params = new URLSearchParams(window.location.search);
            
            const newType = params.get('new');
            if (newType) {
                const type = TYPE_MAP[newType.toLowerCase()] || newType.toLowerCase();
                if (['word', 'cell', 'slide'].includes(type)) { createDocument(type); return; }
            }
            
            const filePath = params.get('file') || params.get('f');
            if (filePath) { openFromUrl(filePath); return; }
            
            // Default: create word document
            createDocument('word');
        }
        
        document.getElementById('file-input').addEventListener('change', function(e) {
            if (e.target.files[0]) openFile(e.target.files[0]);
            this.value = '';
        });
        
        // ============================================
        // APP OBJECT - Fast mode & Lock mechanism prevention
        // ============================================
        window.APP = window.APP || {};
        
        // Fast mode control - prevents lock visualization
        // When Is_Fast() returns true, locks owned by current user are not drawn
        window.APP.isFast = true;  // Start in fast mode
        window.APP.onFastChange = function(isFast) {
            window.APP.isFast = true;  // Always stay in fast mode
            console.log('[APP] onFastChange called, forcing fast mode');
        };
        
        // Disable lock mechanism in the iframe's OnlyOffice editor
        // This patches internal objects to prevent lock-based UI (red labels)
        function disableLockMechanism(iframeWindow) {
            if (!iframeWindow) {
                const iframe = document.querySelector('#editor iframe');
                if (!iframe) return;
                iframeWindow = iframe.contentWindow;
            }
            if (!iframeWindow) return;
            
            // Inner function that does the actual patching - called multiple times
            const tryPatch = () => {
                try {
                    const editor = iframeWindow.Asc?.editor;
                    const ac = iframeWindow.AscCommon;
                    
                    if (!editor && !ac) {
                        return; // Editor not loaded yet, will retry
                    }
                    
                    // === AGGRESSIVE LOCK DISABLE ===
                    
                    // 1. Disable lock drawing at the graphics level
                    if (editor?.WordControl?.m_oDrawingDocument) {
                        editor.WordControl.m_oDrawingDocument.IsLockObjectsEnable = false;
                    }
                    
                    // 2. Disable co-author marks drawing
                    if (editor && 'isCoMarksDraw' in editor) {
                        editor.isCoMarksDraw = false;
                    }
                    
                    // 3. Override the DrawLockParagraph function to do nothing
                    if (ac?.CGraphics?.prototype) {
                        ac.CGraphics.prototype.DrawLockParagraph = function() {};
                        ac.CGraphics.prototype.DrawLockObjectRect = function() {};
                    }
                    
                    // 4. Force collaborative editing into "fast" mode  
                    if (ac?.CollaborativeEditing) {
                        const CE = ac.CollaborativeEditing;
                        if (CE.prototype) {
                            CE.prototype.Is_Fast = function() { return true; };
                            CE.prototype.getFast = function() { return true; };
                            CE.prototype.isLocked = function() { return false; };
                            CE.prototype.Is_SingleUser = function() { return true; };
                        }
                    }
                    
                    // 5. Patch the global collaborative editing instance
                    if (ac?.g_oCollaborativeEditing) {
                        const gCE = ac.g_oCollaborativeEditing;
                        gCE.m_bFast = true;
                        gCE.m_bSingleUser = true;
                        gCE.Is_Fast = function() { return true; };
                        gCE.getFast = function() { return true; };
                        gCE.Is_SingleUser = function() { return true; };
                        gCE.isLocked = function() { return false; };
                        gCE.getLockInfo = function() { return null; };
                        gCE.m_aLocks = [];
                        gCE.m_aLocksToSend = [];
                    }
                    
                    // 6. Patch editor's collaborativeEditing
                    if (editor?.collaborativeEditing) {
                        const eCE = editor.collaborativeEditing;
                        eCE.m_bFast = true;
                        eCE.m_bSingleUser = true;
                        eCE.Is_Fast = function() { return true; };
                        eCE.getFast = function() { return true; };
                        eCE.Is_SingleUser = function() { return true; };
                    }
                    
                    // 7. Patch CoAuthoringApi to disable lock checks
                    if (editor?.CoAuthoringApi) {
                        editor.CoAuthoringApi.isLocked = function() { return false; };
                        editor.CoAuthoringApi.getLock = function() { return true; };
                        editor.CoAuthoringApi.releaseLock = function() {};
                    }
                    
                    // 8. Disable lock checking in document
                    if (ac?.CDocument?.prototype) {
                        ac.CDocument.prototype.IsSelectionLocked = function() { return false; };
                        ac.CDocument.prototype.Document_Is_SelectionLocked = function() { return false; };
                    }
                    
                    // 9. CRITICAL: Disable Add_CheckLock - triggers lock UI
                    if (ac?.CollaborativeEditing) {
                        ac.CollaborativeEditing.Add_CheckLock = function() { return false; };
                    }
                    if (ac?.g_oCollaborativeEditing) {
                        ac.g_oCollaborativeEditing.Add_CheckLock = function() { return false; };
                    }
                    
                    // 10. Patch CLock.Check to do nothing
                    if (ac?.CLock?.prototype) {
                        ac.CLock.prototype.Check = function() { return false; };
                        ac.CLock.prototype.Get_Type = function() { return ac.c_oAscLockTypes?.kLockTypeNone || 0; };
                    }
                    
                    // 11. Patch Paragraph lock checking  
                    if (iframeWindow.AscWord?.Paragraph?.prototype) {
                        iframeWindow.AscWord.Paragraph.prototype.Document_Is_SelectionLocked = function() { return false; };
                    }
                    
                    // 12. Patch text selection lock indicator (for spreadsheets/presentations too)
                    if (ac?.CTableId) {
                        ac.CTableId.prototype.IsSelectionLocked = function() { return false; };
                    }
                    
                    // 13. Kill any existing lock objects
                    if (ac?.g_oCollaborativeEditing?.m_aLocks) {
                        ac.g_oCollaborativeEditing.m_aLocks = [];
                    }
                    
                } catch (e) {
                    // Silently continue - will retry
                }
            };
            
            // Try immediately and multiple times to catch all loading stages
            tryPatch();
            setTimeout(tryPatch, 100);
            setTimeout(tryPatch, 300);
            setTimeout(tryPatch, 500);
            setTimeout(tryPatch, 1000);
            setTimeout(tryPatch, 2000);
            setTimeout(tryPatch, 3000);
            setTimeout(tryPatch, 5000);
        }
        
        // Apply lock patches at page level multiple times
        setTimeout(disableLockMechanism, 100);
        setTimeout(disableLockMechanism, 500);
        setTimeout(disableLockMechanism, 1000);
        setTimeout(disableLockMechanism, 2000);
        setTimeout(disableLockMechanism, 3000);
        setTimeout(disableLockMechanism, 5000);
        setTimeout(disableLockMechanism, 8000);
        setTimeout(disableLockMechanism, 10000);
        
        // ============================================
        // APP.printPdf - Required for OnlyOffice print button
        // Sends document to server for PDF conversion via x2t
        // ============================================
        
        // Helper: Get current document content (binary format)
        async function getDocumentBinary() {
            // Method 1: Check if mock server gave us the binary
            if (window.currentDocumentBinary) {
                console.log('[GetBinary] Using cached currentDocumentBinary');
                return window.currentDocumentBinary;
            }
            
            // Method 2: Try to get from editor API (asc_nativeGetFile)
            try {
                const iframe = document.querySelector('#editor iframe');
                if (iframe && iframe.contentWindow) {
                    const api = iframe.contentWindow.Asc?.editor;
                    if (api) {
                        // Try asc_nativeGetFile (returns binary document)
                        if (api.asc_nativeGetFile) {
                            const nativeFile = api.asc_nativeGetFile();
                            if (nativeFile && nativeFile.byteLength > 0) {
                                console.log('[GetBinary] Got from asc_nativeGetFile:', nativeFile.byteLength, 'bytes');
                                return nativeFile;
                            }
                        }
                        // Try asc_getBinContent (CryptPad's approach)
                        if (api.asc_getBinContent) {
                            const binContent = api.asc_getBinContent();
                            if (binContent) {
                                console.log('[GetBinary] Got from asc_getBinContent');
                                return binContent;
                            }
                        }
                    }
                }
            } catch (e) {
                console.log('[GetBinary] Editor API error:', e.message);
            }
            
            // Method 3: Use the original document blob content
            if (currentDocBlob) {
                try {
                    const arrayBuffer = await currentDocBlob.arrayBuffer();
                    const text = new TextDecoder().decode(arrayBuffer);
                    console.log('[GetBinary] Using original blob, length:', text.length);
                    return new TextEncoder().encode(text);
                } catch (e) {
                    console.log('[GetBinary] Blob read error:', e.message);
                }
            }
            
            return null;
        }
        
        window.APP.printPdf = async function(dataContainer, callback) {
            console.log('[PrintPdf] Called by OnlyOffice');
            
            const pdfBinData = dataContainer?.data;
            if (!pdfBinData) {
                console.error('[PrintPdf] No PDF data in container');
                callback && callback({ status: 'err' });
                return;
            }
            
            console.log('[PrintPdf] pdfbin size:', pdfBinData.byteLength || pdfBinData.length, 'bytes');
            
            // Get the document binary - this is the internal format that x2t can convert
            const docBin = await getDocumentBinary();
            console.log('[PrintPdf] docbin available:', !!docBin, docBin ? (docBin.byteLength || docBin.length) + ' bytes' : 'N/A');
            
            // Build form data
            const formData = new FormData();
            if (docBin) {
                formData.append('docbin', new Blob([docBin]), 'document.bin');
            }
            formData.append('pdfbin', new Blob([pdfBinData]), 'pdf.bin');
            formData.append('filename', 'document');
            
            showToast('Generating PDF...');
            
            fetch('/api/print-pdf', { method: 'POST', body: formData })
                .then(response => {
                    if (!response.ok) {
                        return response.text().then(text => {
                            throw new Error(text || 'Server error: ' + response.status);
                        });
                    }
                    return response.blob();
                })
                .then(pdfBlob => {
                    showToast('PDF ready!', 'success');
                    const url = URL.createObjectURL(pdfBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = currentFileName + '.pdf';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    callback && callback({ status: 'ok' });
                })
                .catch(err => {
                    console.error('[PrintPdf] Error:', err);
                    showToast('PDF failed: ' + err.message, 'error');
                    
                    // Fallback: use browser print dialog
                    console.log('[PrintPdf] Falling back to browser print...');
                    try {
                        const iframe = document.querySelector('#editor iframe');
                        if (iframe && iframe.contentWindow) {
                            iframe.contentWindow.focus();
                            iframe.contentWindow.print();
                        }
                    } catch (e) {}
                    
                    callback && callback({ status: 'err' });
                });
        };
        
        // Init
        loadTemplates();
        setTimeout(handleUrlParams, 300);
    </script>
</body>
