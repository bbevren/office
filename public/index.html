                    }
                    
                    const docBin = window.currentDocumentBinary;
                    const filename = document.getElementById('filename')?.value || 'document';
                    
                    const formData = new FormData();
                    if (docBin) { formData.append('docbin', new Blob([docBin]), 'document.bin'); }
                    formData.append('pdfbin', new Blob([pdfBinData]), 'pdf.bin');
                    formData.append('filename', filename);
                    
                    updateStatus('Generating PDF...');
                    
                    fetch('/api/print-pdf', { method: 'POST', body: formData })
                        .then(response => {
                            if (!response.ok) throw new Error('Server error: ' + response.status);
                            return response.blob();
                        })
                        .then(pdfBlob => {
                            updateStatus('PDF ready!');
                            const url = URL.createObjectURL(pdfBlob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = filename + '.pdf';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            setTimeout(() => URL.revokeObjectURL(url), 1000);
                            callback && callback({ status: 'ok' });
                        })
                        .catch(err => {
                            console.error('[PrintPdf] Error:', err);
                            updateStatus('PDF generation failed: ' + err.message);
                            callback && callback({ status: 'err' });
                        });
                };
                
                // APP.changeTheme - Called by CryptPad-patched OnlyOffice (presentation) when changing design theme
                window.APP.changeTheme = function(indexTheme) {
                    console.log('[changeTheme] Theme change requested:', indexTheme);
                    // In single-user mode, we don't need to sync with others
                };
                
            } catch (err) {
                console.error('[MockServerFast] Failed to connect:', err);
            }
        }

        // Store image data URLs for the current document
        let currentDocumentImages = {};

        async function openFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const ext = file.name.split('.').pop().toLowerCase();
            const typeMap = {
                'docx': 'word', 'doc': 'word', 'odt': 'word', 'rtf': 'word',
                'txt': 'word', 'html': 'word', 'htm': 'word', 'md': 'word',
                'xlsx': 'cell', 'xls': 'cell', 'ods': 'cell', 'csv': 'cell',
                'pptx': 'slide', 'ppt': 'slide', 'odp': 'slide'
            };

            const docType = typeMap[ext];
            if (!docType) {
                alert('Unsupported file type: ' + ext + '\n\nSupported formats:\n• Word: docx, doc, rtf, txt, html, md\n• Excel: xlsx, xls, ods, csv\n• PowerPoint: pptx, ppt');
                return;
            }

            const filename = file.name.replace(/\.[^/.]+$/, '');
            document.getElementById('filename').value = filename;
            
            // Destroy current editor first
            destroyEditor();
            
            // Show loading status
            document.getElementById('editor').innerHTML = '<div class="loading"><div class="spinner"></div><p>Converting document...</p></div>';
            updateStatus(`Converting ${file.name}...`);

            try {
                // Read file as ArrayBuffer
                const arrayBuffer = await file.arrayBuffer();
                console.log('[OpenFile] Read file:', file.name, arrayBuffer.byteLength, 'bytes');
                
                // CryptPad-patched OnlyOffice requires converting to internal format
                // Send to server for conversion
                const response = await fetch('/api/open', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/octet-stream',
                        'X-File-Extension': ext
                    },
                    body: arrayBuffer
                });
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
                
                const result = await response.json();
                if (result.error) {
                    throw new Error(result.error);
                }
                
                console.log('[OpenFile] Conversion successful, data length:', result.size, 'chars');
                console.log('[OpenFile] Data header:', result.data.substring(0, 60));
                
                // The data is already in CryptPad format: DOCY;v5;size;base64data
                // This string goes directly into a text/plain blob for the URL
                // Same as how templates work - NO decoding needed!
                const docBlob = new Blob([result.data], { type: 'text/plain' });
                const docUrl = URL.createObjectURL(docBlob);
                console.log('[OpenFile] Created blob URL for converted document');
                
                // Store image data URLs for this document (as blob URLs)
                currentDocumentImages = {};
                if (result.images && typeof result.images === 'object') {
                    console.log('[OpenFile] Document has images:', Object.keys(result.images));
                    for (const [name, dataUrl] of Object.entries(result.images)) {
                        currentDocumentImages[name] = dataUrl;
                        console.log('[OpenFile] Stored image:', name);
                    }
                }
                
                // Store for cleanup later
                window.pendingDocumentUrl = docUrl;
                currentType = docType;
                
                // Create the editor with the document URL and images
                createEditorForOpenedFile(docType, filename, ext, docUrl);
                
            } catch (err) {
                console.error('[OpenFile] Error:', err);
                alert('Failed to open file: ' + err.message);
                destroyEditor();
                document.getElementById('editor').innerHTML = '<div class="loading"><p style="color: #666;">Click a button above to create a new document</p></div>';
                updateStatus('Failed to open file');
            }
            
            event.target.value = '';
        }

        // Create editor for an opened file (content from converted document URL)
        function createEditorForOpenedFile(type, filename, fileType, documentUrl) {
            // Editor already destroyed by openFile, just update the loading message
            document.getElementById('editor').innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading document...</p></div>';
            updateStatus(`Opening ${filename}.${fileType}...`);
            
            const extMap = { word: 'docx', cell: 'xlsx', slide: 'pptx' };
            const defaultExt = extMap[type] || 'docx';
            
            // Use the provided document URL (blob URL with converted content)
            // This is critical: the URL must point to a blob containing the DOCY/XLSY/PPTY format string

            const config = {
                documentType: type === 'cell' ? 'spreadsheet' : type === 'slide' ? 'presentation' : 'word',
                document: {
                    fileType: defaultExt,  // Use internal format type, not original file type
                    key: 'doc_' + Date.now().toString(),
                    title: `${filename}.${fileType || defaultExt}`,
                    url: documentUrl,  // Blob URL with converted document content
                    permissions: {
                        edit: true,
                        download: true,
                        print: true
                    }
                },
                editorConfig: {
                    mode: 'edit',
                    lang: 'en',
                    user: {
                        id: GLOBAL_USER_ID,
                        name: 'Guest'
                    },
                    // CRITICAL: Disable collaborative editing locks for single-user mode
                    coEditing: {
                        mode: 'fast',
                        change: false
                    },
                    customization: {
                        autosave: false,
                        forcesave: false,
                        chat: false,
                        comments: false,
                        compactHeader: true,
                        help: false,
                        about: false,
                        feedback: false
                    }
                },
                events: {
                    onAppReady: function() {
                        console.log('[Editor] App ready (opened file)');
                        try {
                            const iframe = document.querySelector('#editor iframe');
                            if (iframe) {
                                // Force iframe to fill container
                                iframe.style.position = 'absolute';
                                iframe.style.top = '0';
                                iframe.style.left = '0';
                                iframe.style.width = '100%';
                                iframe.style.height = '100%';
                                iframe.style.border = 'none';
                                console.log('[Editor] Forced iframe sizing');
                                
                                if (iframe.contentWindow) {
                                    injectDownloadInterceptor(iframe.contentWindow);
                                }
                            }
                        } catch (e) {
                            console.log('[Editor] Could not inject interceptor:', e.message);
                        }
                    },
                    onDocumentReady: function() {
                        console.log('[Editor] Document ready (opened file)');
                        updateStatus(`Ready • Editing ${filename}.${fileType || defaultExt}`);
                        // Clean up blob URL after document loads
                        if (window.pendingDocumentUrl) {
                            URL.revokeObjectURL(window.pendingDocumentUrl);
                            window.pendingDocumentUrl = null;
                        }
                        
                        // Extra lock disable attempt after document is ready
                        if (!coEditEnabled) {
                            const iframe = document.querySelector('#editor iframe');
                            if (iframe && iframe.contentWindow) {
                                disableLockMechanism(iframe.contentWindow);
                            }
                        }
                    },
                    onError: function(e) {
                        console.error('[Editor] Error:', e);
                        if (!window._downloadInProgress) {
                            updateStatus('Error: ' + (e.data?.errorDescription || 'Unknown error'));
                        }
                    }
                }
            };

            editor = new DocsAPI.DocEditor('editor', config);
            
            // Start iframe patching for opened files (same as createDocument)
            let iframePatchAttempt = 0;
            const tryPatchIframe = () => {
                iframePatchAttempt++;
                try {
                    let editorFrame = document.querySelector('#editor iframe');
                    if (editorFrame && editorFrame.contentWindow) {
                        const iframeWin = editorFrame.contentWindow;
                        
                        // Inject custom CSS styles
                        injectCustomStyles(iframeWin);
                        
                        // Patch fetch
                        if (iframeWin.fetch && !iframeWin._fetchPatched) {
                            const originalFetch = iframeWin.fetch;
                            iframeWin.fetch = function(...args) {
                                const [resource] = args;
                                const url = typeof resource === 'string' ? resource : resource?.url;
                                if (url && url.includes('/downloadas/')) {
                                    window._downloadInProgress = true;
                                    window._downloadStartTime = Date.now();
                                    pollForDownload();
                                }
                                return originalFetch.apply(this, args);
                            };
                            iframeWin._fetchPatched = true;
                        }
                        
                        // Patch XHR
                        if (iframeWin.XMLHttpRequest && !iframeWin._xhrPatched) {
                            const OrigXHR = iframeWin.XMLHttpRequest;
                            iframeWin.XMLHttpRequest = function() {
                                const xhr = new OrigXHR();
                                const origOpen = xhr.open;
                                xhr.open = function(method, url, ...rest) {
                                    if (method === 'POST' && url.includes('/downloadas/')) {
                                        window._downloadInProgress = true;
                                        window._downloadStartTime = Date.now();
                                        pollForDownload();
                                    }
                                    return origOpen.call(this, method, url, ...rest);
                                };
                                return xhr;
                            };
                            iframeWin._xhrPatched = true;
                        }
                        
                        console.log('[OpenFile] ✓ Iframe patched with custom styles');
                    } else if (iframePatchAttempt < 20) {
                        setTimeout(tryPatchIframe, 500);
                    }
                } catch (e) {
                    if (iframePatchAttempt < 20) setTimeout(tryPatchIframe, 500);
                }
            };
            setTimeout(tryPatchIframe, 1000);
            
            // CryptPad-patched OnlyOffice requires mock server
            // Document content is already loaded via URL - mock server handles collaborative features
            // Use fast mode unless co-editing is enabled
            if (coEditEnabled) {
                console.log('[Editor] Co-editing enabled - connecting full mock server...');
                connectMockServer(editor, type, filename);
            } else {
                console.log('[Editor] Co-editing disabled - connecting fast mock server...');
                connectMockServerFast(editor, type, filename);
            }
        }

        function loadDocumentInEditor(type, filename, fileType, documentUrl) {
            // This function is kept for backwards compatibility but shouldn't be used
            // Use createEditorForOpenedFile instead
            console.warn('[loadDocumentInEditor] Deprecated - use createEditorForOpenedFile');
            createEditorForOpenedFile(type, filename, fileType, documentUrl);
        }

        async function downloadDocument() {
            if (!editor) {
                alert('Please create or open a document first');
                return;
            }

            const filename = document.getElementById('filename').value || 'Untitled';
            const extMap = { word: 'docx', cell: 'xlsx', slide: 'pptx' };
            const ext = extMap[currentType] || 'docx';

            console.log('[DownloadDocument] ▶ Starting download for:', `${filename}.${ext}`);
            updateStatus(`Downloading ${filename}.${ext}...`);
            
            // Mark that we're starting a download - helps suppress spurious errors/warnings
            // Set both flags to ensure comprehensive error suppression
            window._downloadInProgress = true;
            window._downloadStartTime = Date.now();
            // Clear any previous success state 
            window._downloadSuccess = false;
            // Store the desired filename for the XHR interceptor to pass to server
            window._pendingDownloadFilename = `${filename}.${ext}`;
            console.log('[DownloadDocument] Set download flags and filename override, calling editor.downloadAs()');
            
            // Use the SDK's native downloadAs - it has access to the actual document content
            try {
                editor.downloadAs(`${filename}.${ext}`);
                console.log('[DownloadDocument] ✓ editor.downloadAs() called, starting poll...');
                
                // Poll for the download to be ready (since SDK doesn't call our callback)
                pollForDownload();
            } catch (err) {
                console.error('[Download] SDK downloadAs failed:', err);
                updateStatus('Download failed: ' + err.message);
                // Keep download flag active for a bit to suppress any late errors
                setTimeout(() => {
                    window._downloadInProgress = false;
                }, 5000);
            }
        }
        
        // Also provide a function to trigger save from File menu format buttons
        function saveAsFormat(format) {
            if (!editor) {
                alert('Please create or open a document first');
                return;
            }
            
            const filename = document.getElementById('filename').value || 'Untitled';
            console.log('[SaveAsFormat] ▶ Starting saveAsFormat with format:', format);
            updateStatus(`Downloading ${filename}.${format}...`);
            
            // Mark download in progress and store desired filename
            window._downloadInProgress = true;
            window._downloadStartTime = Date.now();
            window._pendingDownloadFilename = `${filename}.${format}`;
            
            try {
                editor.downloadAs(`${filename}.${format}`);
                pollForDownload();
            } catch (err) {
                console.error('[Download] SDK downloadAs failed:', err);
                window._downloadInProgress = false;
            }
        }
        
        // Poll the server for completed downloads
        async function pollForDownload() {
            let attempts = 0;
            const maxAttempts = 30; // 15 seconds max
            
            const poll = async () => {
                try {
                    const response = await fetch('/api/latest-download');
                    const data = await response.json();
                    
                    if (data.url) {
                        console.log('[Poll] Download ready:', data.url);
                        const success = await triggerFileDownload(data.url);
                        // triggerFileDownload handles the state management now
                        return;
                    }
                    
                    attempts++;
                    if (attempts < maxAttempts) {
                        setTimeout(poll, 500);
                    } else {
                        updateStatus('Download timed out');
                        // Keep suppression active briefly even on timeout
                        setTimeout(() => {
                            window._downloadInProgress = false;
                        }, 3000);
                    }
                } catch (err) {
                    console.error('[Poll] Error:', err);
                    // Keep suppression active briefly
                    setTimeout(() => {
                        window._downloadInProgress = false;
                    }, 3000);
                }
            };
            
            // Start polling after a short delay to let server process
            setTimeout(poll, 500);
        }
        
        // Legacy download function - kept for reference but not used
        async function downloadDocumentDirect() {
            if (!editor) {
                alert('Please create or open a document first');
                return;
            }

            const filename = document.getElementById('filename').value || 'Untitled';
            const extMap = { word: 'docx', cell: 'xlsx', slide: 'pptx' };
            const ext = extMap[currentType] || 'docx';

            updateStatus(`Downloading ${filename}.${ext}...`);
            
            // Get the current document content from the template + changes
            // For CryptPad patched version, the document content is in internal format
            const template = EmptyDocTemplates[currentType];
            if (!template) {
                alert('Cannot export: no template available');
                return;
            }
            
            try {
                // Use our custom conversion endpoint
                updateStatus(`Converting to ${ext}...`);
                
                // Build the document content - template + changes
                const docContent = template;  // Full internal format doc
                
                // Create FormData with the document
                const formData = new FormData();
                const blob = new Blob([docContent], { type: 'text/plain' });
                formData.append('file', blob, `${filename}.bin`);
                formData.append('outputFormat', ext);
                formData.append('title', `${filename}.${ext}`);
                
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`Conversion failed: ${response.statusText}`);
                }
                
                // Download the converted file
                const resultBlob = await response.blob();
                const url = URL.createObjectURL(resultBlob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `${filename}.${ext}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                updateStatus(`Downloaded: ${filename}.${ext}`);
                console.log('[Download] Successfully exported to', ext);
                
            } catch (err) {
                console.error('[Download] Conversion failed:', err);
                
                // Fallback: Download the internal format
                updateStatus('Conversion failed, downloading internal format...');
                downloadInternalFormat(filename);
            }
        }
        
        // Download document in internal format (can be converted later with x2t)
        function downloadInternalFormat(filename) {
            const template = EmptyDocTemplates[currentType];
            if (!template) {
                alert('Cannot export: no template available');
                return;
            }
            
            // Combine template with changes to create the full document
            // The format is: TYPE;version;size;base64data followed by changes
            let exportData = template;
            
            if (documentChanges && documentChanges.length > 0) {
                // Append changes in the format expected by x2t
                // Each change is appended as a separate entry
                console.log('[Download] Including', documentChanges.length, 'changes');
                exportData += '\n' + JSON.stringify({ changes: documentChanges });
            }
            
            // Create blob and download
            const blob = new Blob([exportData], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            
            // Use internal format extension
            const internalExt = currentType === 'word' ? 'bin' : 
                               currentType === 'cell' ? 'bin' : 'bin';
            a.download = `${filename}.${internalExt}`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            updateStatus(`Downloaded ${filename}.${internalExt} (internal format)`);
            console.log('[Download] Exported internal format');
        }

        // Initialize
        updateStatus('Ready • Click "New Document", "New Spreadsheet", or "New Presentation" to start');
        console.log('[Init] OnlyOffice Serverless Editor loaded');
        console.log('[Init] DocsAPI available:', typeof DocsAPI !== 'undefined');
    </script>
