<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .toolbar {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .toolbar button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .toolbar button:hover {
            background: #f8f8f8;
            border-color: #4a90e2;
        }
        .toolbar button.primary {
            background: #4a90e2;
            color: white;
            border-color: #4a90e2;
        }
        .toolbar button.primary:hover {
            background: #357abd;
        }
        .toolbar input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            width: 200px;
        }
        .toolbar input[type="file"] {
            display: none;
        }
        .editor-container {
            flex: 1;
            position: relative;
            background: #fff;
        }
        #editor {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #editor iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none;
        }
        .status {
            padding: 8px 20px;
            background: #f9f9f9;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4a90e2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button class="primary" onclick="createDocument('word')">📝 New Document</button>
        <button class="primary" onclick="createDocument('cell')">📊 New Spreadsheet</button>
        <button class="primary" onclick="createDocument('slide')">📽️ New Presentation</button>
        <span style="margin: 0 10px; color: #ccc;">|</span>
        <input type="text" id="filename" placeholder="Document name" value="Untitled">
        <button onclick="document.getElementById('fileInput').click()">📂 Open</button>
        <input type="file" id="fileInput" accept=".docx,.xlsx,.pptx,.ods,.doc,.xls,.ppt,.rtf,.csv,.txt,.md,.html,.htm" onchange="openFile(event)">
        <!-- Download via File menu > Download as -->
    </div>
    
    <div class="editor-container" id="editorContainer">
        <div id="editor">
            <div class="loading" id="welcomeScreen">
                <p style="font-size: 16px; color: #666;">Click a button above to create a new document</p>
            </div>
        </div>
    </div>
    
    <div class="status">
        <span id="status">Ready • Select a document type to begin</span>
    </div>

    <script src="/onlyoffice/v8/web-apps/apps/api/documents/api.js"></script>
    <script>
        // Register service worker to intercept download requests
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(reg => {
                    console.log('[SW Reg] Service worker registered:', reg.scope);
                    console.log('[SW Reg] Current state:', reg.installing ? 'installing' : reg.waiting ? 'waiting' : reg.active ? 'active' : 'unknown');
                })
                .catch(err => {
                    console.error('[SW Reg] Registration failed:', err);
                });
            
            // Listen for download notifications from service worker
            navigator.serviceWorker.addEventListener('message', (event) => {
                console.log('[SW Message] ✓ Message received from service worker:', event.data);
                if (event.data.type === 'download-ready' && event.data.url) {
                    console.log('[SW Message] ✓ Download ready, calling triggerFileDownload with:', event.data.url);
                    triggerFileDownload(event.data.url);
                } else {
                    console.log('[SW Message] ✗ Not a download-ready message or no URL');
                }
            });
            
            console.log('[SW] Service worker message listener installed');
        } else {
            console.warn('[SW] Service Worker not supported');
        }
        
        // Template loading - CryptPad format templates loaded dynamically
        // The templates are AMD modules that return functions (taking newOO param) that return template strings
        const EmptyDocTemplates = {
            word: null,
            cell: null,
            slide: null
        };

        // Simple AMD loader for our template modules
        window.define = function(factory) {
            window._lastAMDModule = factory();
        };
        window.define.amd = true;

        // Intercept both XHR and Fetch to catch download responses from OnlyOffice SDK
        (function() {
            // XHR Interception
            const originalXHROpen = XMLHttpRequest.prototype.open;
            const originalXHRSend = XMLHttpRequest.prototype.send;
            
            XMLHttpRequest.prototype.open = function(method, url) {
                if (method === 'POST' && url.includes('/downloadas/')) {
                    console.log('[XHR Open] Download request detected:', url);
                }
                this._downloadUrl = (method === 'POST' && url.includes('/downloadas/')) ? url : null;
                return originalXHROpen.apply(this, arguments);
            };
            
            XMLHttpRequest.prototype.send = function(body) {
                if (this._downloadUrl) {
                    console.log('[XHR Send] Sending download request, body size:', body ? body.length : 0);
                    const xhr = this;
                    const originalOnReadyStateChange = xhr.onreadystatechange;
                    
                    xhr.onreadystatechange = function() {
                        console.log('[XHR State] readyState:', xhr.readyState, 'status:', xhr.status);
                        if (xhr.readyState === 4 && xhr.status === 200) {
                            try {
                                const response = JSON.parse(xhr.responseText);
                                console.log('[XHR Intercept] ✓ Download response:', response);
                                
                                if (response.error === 0 && response.url) {
                                    console.log('[XHR Intercept] ✓ Valid URL found, triggering download:', response.url);
                                    setTimeout(() => {
                                        console.log('[XHR Intercept] Now downloading:', response.url);
                                        triggerFileDownload(response.url);
                                    }, 100);
                                } else {
                                    console.log('[XHR Intercept] ✗ Invalid response, error:', response.error);
                                }
                            } catch (e) {
                                console.log('[XHR Intercept] ✗ Not JSON response:', xhr.responseText.substring(0, 100));
                            }
                        }
                        if (originalOnReadyStateChange) {
                            originalOnReadyStateChange.apply(this, arguments);
                        }
                    };
                }
                return originalXHRSend.apply(this, arguments);
            };
            
            console.log('[XHR Intercept] XHR download response interceptor installed');
            
            // Fetch Interception
            const originalFetch = window.fetch;
            window.fetch = function(...args) {
                const [resource, config] = args;
                const url = typeof resource === 'string' ? resource : resource.url;
                const method = (config && config.method) || 'GET';
                
                if (method === 'POST' && url.includes('/downloadas/')) {
                    console.log('[Fetch Open] Download request detected:', url);
                    console.log('[Fetch Send] Body size:', config && config.body ? config.body.length || config.body.byteLength : 0);
                }
                
                const fetchPromise = originalFetch.apply(this, args);
                
                if (method === 'POST' && url.includes('/downloadas/')) {
                    return fetchPromise
                        .then(async (response) => {
                            console.log('[Fetch Response] Status:', response.status);
                            const clonedResponse = response.clone();
                            const text = await response.text();
                            
                            try {
                                const data = JSON.parse(text);
                                console.log('[Fetch Intercept] ✓ Download response:', data);
                                
                                if (data.error === 0 && data.url) {
                                    console.log('[Fetch Intercept] ✓ Valid URL found, triggering download:', data.url);
                                    setTimeout(() => {
                                        console.log('[Fetch Intercept] Now downloading:', data.url);
                                        triggerFileDownload(data.url);
                                    }, 100);
                                } else {
                                    console.log('[Fetch Intercept] ✗ Invalid response, error:', data.error);
                                }
                            } catch (e) {
                                console.log('[Fetch Intercept] ✗ Not JSON response');
                            }
                            
                            // Return original response to SDK
                            return new Response(text, {
                                status: clonedResponse.status,
                                statusText: clonedResponse.statusText,
                                headers: clonedResponse.headers
                            });
                        })
                        .catch(err => {
                            console.error('[Fetch Intercept] Error:', err);
                            return fetchPromise;
                        });
                }
                
                return fetchPromise;
            };
            
            console.log('[Fetch Intercept] Fetch download response interceptor installed');
        })();

        // Load templates from server
        async function loadTemplates() {
            console.log('[Templates] Loading CryptPad templates...');
            
            const templateConfig = [
                { type: 'word', path: '/templates/oodoc_base.js' },
                { type: 'cell', path: '/templates/oocell_base.js' },
                { type: 'slide', path: '/templates/ooslide_base.js' }
            ];

            for (const config of templateConfig) {
                try {
                    // Load via script tag to execute AMD define
                    await new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = config.path;
                        script.onload = () => {
                            // After script loads, _lastAMDModule contains the factory result (a function)
                            if (window._lastAMDModule) {
                                // Call the function with newOO=true to get the newer format
                                const templateFn = window._lastAMDModule;
                                const template = templateFn(true);  // Use newOO=true format
                                if (template) {
                                    EmptyDocTemplates[config.type] = template;
                                    console.log(`[Templates] Loaded ${config.type}: ${template.substring(0, 60)}... (${template.length} chars)`);
                                } else {
                                    // Try without newOO param
                                    const templateOld = templateFn();
                                    if (templateOld) {
                                        EmptyDocTemplates[config.type] = templateOld;
                                        console.log(`[Templates] Loaded ${config.type} (old): ${templateOld.substring(0, 60)}... (${templateOld.length} chars)`);
                                    }
                                }
                                window._lastAMDModule = null;
                            }
                            resolve();
                        };
                        script.onerror = reject;
                        document.head.appendChild(script);
                    });
                } catch (err) {
                    console.error(`[Templates] Failed to load ${config.type}:`, err);
                }
            }
            
            console.log('[Templates] Loaded:', {
                word: EmptyDocTemplates.word ? EmptyDocTemplates.word.length + ' chars' : 'MISSING',
                cell: EmptyDocTemplates.cell ? EmptyDocTemplates.cell.length + ' chars' : 'MISSING',
                slide: EmptyDocTemplates.slide ? EmptyDocTemplates.slide.length + ' chars' : 'MISSING'
            });
        }

        // Load templates on page load
        loadTemplates();

        // ========== CO-EDITING CONFIGURATION ==========
        // Enable collaborative editing via URL parameter: ?coedit=true
        // When disabled (default), editor runs in fast single-user mode with no lock checking
        // When enabled, MockServer handles locks for future custom server integration
        const urlParamsGlobal = new URLSearchParams(window.location.search);
        const coEditEnabled = urlParamsGlobal.get('coedit') === 'true';
        console.log('[Config] Co-editing mode:', coEditEnabled ? 'ENABLED (lock-based)' : 'DISABLED (fast single-user)');

        // CRITICAL: Use a single user ID across editor config and mock server
        // This ensures lock ownership is correctly attributed to "us"
        const GLOBAL_USER_ID = 'user_' + Math.random().toString(36).substr(2, 9);
        console.log('[Config] Global user ID:', GLOBAL_USER_ID);

        // ========== URL PARAMETER FILE OPENING ==========
        // Support opening files via URL parameters: ?f=filename.docx or ?file=filename.docx
        // Files are loaded from /samples/ directory or full URL
        async function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const fileParam = urlParams.get('f') || urlParams.get('file');
            
            if (fileParam) {
                console.log('[URL Params] File parameter found:', fileParam);
                await openFileFromUrl(fileParam);
            }
        }

        // Open a file from URL parameter
        async function openFileFromUrl(filename) {
            try {
                // Decode URI component in case it was encoded
                const decodedFilename = decodeURIComponent(filename);
                
                // Determine the URL - if it's a full URL use it, otherwise use /samples/
                let fileUrl;
                if (decodedFilename.startsWith('http://') || decodedFilename.startsWith('https://') || decodedFilename.startsWith('/')) {
                    fileUrl = decodedFilename;
                } else {
                    // Encode the filename for URL (handles spaces and special characters)
                    fileUrl = '/samples/' + encodeURIComponent(decodedFilename);
                }
                
                console.log('[URL Open] Fetching file:', fileUrl);
                updateStatus(`Loading ${decodedFilename}...`);
                
                const response = await fetch(fileUrl);
                if (!response.ok) {
                    throw new Error(`File not found: ${response.status}`);
                }
                
                const arrayBuffer = await response.arrayBuffer();
                console.log('[URL Open] Fetched file:', arrayBuffer.byteLength, 'bytes');
                
                // Get extension from filename
                const ext = filename.split('.').pop().toLowerCase();
                const typeMap = {
                    'docx': 'word', 'doc': 'word', 'odt': 'word', 'rtf': 'word',
                    'txt': 'word', 'html': 'word', 'htm': 'word', 'md': 'word',
                    'xlsx': 'cell', 'xls': 'cell', 'ods': 'cell', 'csv': 'cell',
                    'pptx': 'slide', 'ppt': 'slide', 'odp': 'slide'
                };
                
                const docType = typeMap[ext];
                if (!docType) {
                    throw new Error(`Unsupported file type: ${ext}`);
                }
                
                // Set filename in input (without extension)
                const baseName = filename.replace(/\.[^/.]+$/, '').split('/').pop();
                document.getElementById('filename').value = baseName;
                
                // Destroy current editor
                destroyEditor();
                
                // Show loading status
                document.getElementById('editor').innerHTML = '<div class="loading"><div class="spinner"></div><p>Converting document...</p></div>';
                updateStatus(`Converting ${filename}...`);
                
                // Send to server for conversion
                const convertResponse = await fetch('/api/open', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/octet-stream',
                        'X-File-Extension': ext
                    },
                    body: arrayBuffer
                });
                
                if (!convertResponse.ok) {
                    throw new Error(`Server error: ${convertResponse.status}`);
                }
                
                const result = await convertResponse.json();
                if (result.error) {
                    throw new Error(result.error);
                }
                
                console.log('[URL Open] Conversion successful, data length:', result.size, 'chars');
                
                // Create blob URL for the converted document
                const docBlob = new Blob([result.data], { type: 'text/plain' });
                const docUrl = URL.createObjectURL(docBlob);
                
                // Store image data URLs
                currentDocumentImages = {};
                if (result.images && typeof result.images === 'object') {
                    for (const [name, dataUrl] of Object.entries(result.images)) {
                        currentDocumentImages[name] = dataUrl;
                    }
                }
                
                window.pendingDocumentUrl = docUrl;
                currentType = docType;
                
                // Create the editor
                createEditorForOpenedFile(docType, baseName, ext, docUrl);
                
            } catch (err) {
                console.error('[URL Open] Error:', err);
                alert('Failed to open file from URL: ' + err.message);
                destroyEditor();
                document.getElementById('editor').innerHTML = '<div class="loading"><p style="color: #666;">Click a button above to create a new document</p></div>';
                updateStatus('Failed to open file');
            }
        }

        // Check URL params after templates are loaded
        setTimeout(checkUrlParams, 500);

        // ========== IFRAME CUSTOM STYLES INJECTION ==========
        // Load and inject custom CSS into editor iframe
        let customIframeStyles = null;
        
        async function loadCustomIframeStyles() {
            try {
                const response = await fetch('/iframe-styles.css');
                if (response.ok) {
                    customIframeStyles = await response.text();
                    console.log('[Iframe Styles] Loaded custom styles:', customIframeStyles.length, 'chars');
                }
            } catch (e) {
                console.log('[Iframe Styles] No custom styles file found');
            }
        }
        
        // Inject custom styles into iframe
        function injectCustomStyles(iframeWindow) {
            if (!customIframeStyles || !iframeWindow || !iframeWindow.document) return;
            
            try {
                const doc = iframeWindow.document;
                
                // Check if already injected
                if (doc.getElementById('custom-iframe-styles')) return;
                
                const style = doc.createElement('style');
                style.id = 'custom-iframe-styles';
                style.textContent = customIframeStyles;
                doc.head.appendChild(style);
                
                console.log('[Iframe Styles] ✓ Custom styles injected into iframe');
            } catch (e) {
                console.log('[Iframe Styles] Failed to inject styles:', e.message);
            }
        }
        
        // Disable lock mechanism in the iframe's OnlyOffice editor
        // This patches internal objects to prevent lock-based UI (red "Guest" labels)
        function disableLockMechanism(iframeWindow) {
            if (!iframeWindow) return;
            
            try {
                console.log('[Lock Disable] Attempting to disable lock visualization...');
                
                // Try to find and patch the editor internals
                const tryPatch = () => {
                    try {
                        const editor = iframeWindow.Asc?.editor;
                        const ac = iframeWindow.AscCommon;
                        
                        // === AGGRESSIVE LOCK DISABLE ===
                        
                        // 1. Disable lock drawing at the graphics level
                        if (editor?.WordControl?.m_oDrawingDocument) {
                            editor.WordControl.m_oDrawingDocument.IsLockObjectsEnable = false;
                            console.log('[Lock Disable] ✓ IsLockObjectsEnable = false');
                        }
                        
                        // 2. Disable co-author marks drawing
                        if (editor && 'isCoMarksDraw' in editor) {
                            editor.isCoMarksDraw = false;
                        }
                        
                        // 3. Override the DrawLockParagraph function to do nothing
                        if (ac?.CGraphics?.prototype) {
                            ac.CGraphics.prototype.DrawLockParagraph = function() {};
                            ac.CGraphics.prototype.DrawLockObjectRect = function() {};
                            console.log('[Lock Disable] ✓ Disabled DrawLockParagraph/DrawLockObjectRect');
                        }
                        
                        // 4. Force collaborative editing into "fast" mode  
                        if (ac?.CollaborativeEditing) {
                            console.log('[Lock Disable] Found CollaborativeEditing');
                            const CE = ac.CollaborativeEditing;
                            if (CE.prototype) {
                                CE.prototype.Is_Fast = function() { return true; };
                                CE.prototype.getFast = function() { return true; };
                                CE.prototype.isLocked = function() { return false; };
                                CE.prototype.Is_SingleUser = function() { return true; };
                            }
                        }
                        
                        // 5. Patch the global collaborative editing instance
                        if (ac?.g_oCollaborativeEditing) {
                            const gCE = ac.g_oCollaborativeEditing;
                            gCE.m_bFast = true;
                            gCE.m_bSingleUser = true;
                            gCE.Is_Fast = function() { return true; };
                            gCE.getFast = function() { return true; };
                            gCE.Is_SingleUser = function() { return true; };
                            gCE.isLocked = function() { return false; };
                            gCE.getLockInfo = function() { return null; };
                            gCE.m_aLocks = [];
                            gCE.m_aLocksToSend = [];
                            console.log('[Lock Disable] ✓ Patched g_oCollaborativeEditing');
                        }
                        
                        // 6. Patch editor's collaborativeEditing
                        if (editor?.collaborativeEditing) {
                            const eCE = editor.collaborativeEditing;
                            eCE.m_bFast = true;
                            eCE.m_bSingleUser = true;
                            eCE.Is_Fast = function() { return true; };
                            eCE.getFast = function() { return true; };
                            eCE.Is_SingleUser = function() { return true; };
                            console.log('[Lock Disable] ✓ Patched editor.collaborativeEditing');
                        }
                        
                        // 7. Patch CoAuthoringApi to disable lock checks
                        if (editor?.CoAuthoringApi) {
                            editor.CoAuthoringApi.isLocked = function() { return false; };
                            editor.CoAuthoringApi.getLock = function() { return true; }; // Always grant
                            editor.CoAuthoringApi.releaseLock = function() {};
                            console.log('[Lock Disable] ✓ Patched Asc.editor.CoAuthoringApi');
                        }
                        
                        // 8. Disable lock checking in document
                        if (ac?.CDocument?.prototype) {
                            ac.CDocument.prototype.IsSelectionLocked = function() { return false; };
                            ac.CDocument.prototype.Document_Is_SelectionLocked = function() { return false; };
                            console.log('[Lock Disable] ✓ Patched CDocument.IsSelectionLocked');
                        }
                        
                        // 9. CRITICAL: Disable Add_CheckLock - this is what triggers the lock UI
                        if (ac?.CollaborativeEditing) {
                            ac.CollaborativeEditing.Add_CheckLock = function() { return false; };
                            console.log('[Lock Disable] ✓ Disabled CollaborativeEditing.Add_CheckLock');
                        }
                        if (ac?.g_oCollaborativeEditing) {
                            ac.g_oCollaborativeEditing.Add_CheckLock = function() { return false; };
                            console.log('[Lock Disable] ✓ Disabled g_oCollaborativeEditing.Add_CheckLock');
                        }
                        
                        // 10. Patch CLock.Check to do nothing
                        if (ac?.CLock?.prototype) {
                            ac.CLock.prototype.Check = function() { return false; };
                            ac.CLock.prototype.Get_Type = function() { return ac.c_oAscLockTypes?.kLockTypeNone || 0; };
                            console.log('[Lock Disable] ✓ Patched CLock.Check');
                        }
                        
                        // 11. Patch Paragraph lock checking  
                        if (iframeWindow.AscWord?.Paragraph?.prototype) {
                            iframeWindow.AscWord.Paragraph.prototype.Document_Is_SelectionLocked = function() { return false; };
                            console.log('[Lock Disable] ✓ Patched AscWord.Paragraph');
                        }
                        
                    } catch (e) {
                        console.log('[Lock Disable] Patch attempt error:', e.message);
                    }
                };
                
                // Try immediately and multiple times
                tryPatch();
                setTimeout(tryPatch, 100);
                setTimeout(tryPatch, 300);
                setTimeout(tryPatch, 500);
                setTimeout(tryPatch, 1000);
                setTimeout(tryPatch, 2000);
                setTimeout(tryPatch, 3000);
                setTimeout(tryPatch, 5000);
                
            } catch (e) {
                console.log('[Lock Disable] Error:', e.message);
            }
        }
        
        // Load custom styles on page load
        loadCustomIframeStyles();

        let editor = null;
        let currentType = null;
        let currentDocUrl = null;
        let currentDocBlob = null;  // Store the document blob for mock server
        let documentContent = null;
        let documentChanges = [];  // Store all changes for export
        let templatesLoaded = false;

        // Destroy current editor and recreate the editor div
        function destroyEditor() {
            console.log('[Editor] Destroying current editor...');
            
            // Revoke any existing blob URL
            if (currentDocUrl) {
                URL.revokeObjectURL(currentDocUrl);
                currentDocUrl = null;
            }
            
            // Try to destroy editor if it has a method
            if (editor) {
                try {
                    if (typeof editor.destroyEditor === 'function') {
                        editor.destroyEditor();
                    }
                } catch (e) {
                    console.log('[Editor] No destroy method or error:', e);
                }
                editor = null;
            }
            
            // Recreate the editor container div
            const container = document.getElementById('editorContainer');
            if (container) {
                // Remove old editor div completely
                container.innerHTML = '';
                // Create fresh editor div
                const newEditorDiv = document.createElement('div');
                newEditorDiv.id = 'editor';
                container.appendChild(newEditorDiv);
                console.log('[Editor] Fresh editor div created');
            }
            
            // Reset state
            currentDocBlob = null;
            documentContent = null;
            documentChanges = [];
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            console.log('[Status]', message);
        }

        // Inject XHR interceptor into iframe to catch download responses
        function injectDownloadInterceptor(win) {
            try {
                const originalXHROpen = win.XMLHttpRequest.prototype.open;
                const originalXHRSend = win.XMLHttpRequest.prototype.send;
                
                win.XMLHttpRequest.prototype.open = function(method, url) {
                    this._isDownload = (method === 'POST' && url.includes('/downloadas/'));
                    return originalXHROpen.apply(this, arguments);
                };
                
                win.XMLHttpRequest.prototype.send = function(body) {
                    if (this._isDownload) {
                        const xhr = this;
                        const originalHandler = xhr.onreadystatechange;
                        
                        xhr.onreadystatechange = function() {
                            if (xhr.readyState === 4 && xhr.status === 200) {
                                try {
                                    const response = JSON.parse(xhr.responseText);
                                    console.log('[Iframe XHR] Download response:', response);
                                    
                                    if (response.error === 0 && response.url) {
                                        console.log('[Iframe XHR] Triggering download:', response.url);
                                        // Mark that download is in progress
                                        window._downloadInProgress = true;
                                        window._downloadStartTime = Date.now();
                                        // Use parent window's download function
                                        window.triggerFileDownload(response.url);
                                    }
                                } catch (e) {
                                    // Not JSON, ignore
                                }
                            }
                            if (originalHandler) {
                                originalHandler.apply(this, arguments);
                            }
                        };
                    }
                    return originalXHRSend.apply(this, arguments);
                };
                
                // Override the iframe's alert to suppress download-related errors
                const originalAlert = win.alert;
                win.alert = function(msg) {
                    // Suppress alerts during download operations or after successful download
                    if (window._downloadInProgress || (window._downloadSuccess && (Date.now() - window._downloadSuccessTime < 10000))) {
                        console.log('[Iframe] Suppressing alert during download operation:', msg);
                        return;
                    }
                    return originalAlert.apply(this, arguments);
                };
                
                // Comprehensive interception of all OnlyOffice error dialogs
                function interceptAllErrorDialogs() {
                    // Check if download is in progress (within last 10 seconds)
                    const isDownloadActive = () => {
                        return window._downloadInProgress || 
                               (window._downloadSuccess && (Date.now() - window._downloadSuccessTime < 10000)) ||
                               (window._downloadStartTime && (Date.now() - window._downloadStartTime < 15000));
                    };
                    
                    // Intercept Common.UI.alert
                    if (win.Common && win.Common.UI && win.Common.UI.alert) {
                        const originalUIAlert = win.Common.UI.alert;
                        win.Common.UI.alert = function(opts) {
                            if (isDownloadActive()) {
                                console.log('[Iframe] Suppressing Common.UI.alert:', opts?.msg || opts);
                                // Call the callback if provided to let the flow continue
                                if (opts && opts.callback) {
                                    setTimeout(() => opts.callback('ok'), 10);
                                }
                                return;
                            }
                            return originalUIAlert.apply(this, arguments);
                        };
                        console.log('[Iframe] Common.UI.alert interceptor installed');
                    }
                    
                    // Intercept Common.UI.warning
                    if (win.Common && win.Common.UI && win.Common.UI.warning) {
                        const originalUIWarning = win.Common.UI.warning;
                        win.Common.UI.warning = function(opts) {
                            if (isDownloadActive()) {

                                if (opts && opts.callback) {
                                    setTimeout(() => opts.callback('ok'), 10);
                                }
                                return;
                            }
                            return originalUIWarning.apply(this, arguments);
                        };
                    }
                    
                    // Intercept Common.UI.error 
                    if (win.Common && win.Common.UI && win.Common.UI.error) {
                        const originalUIError = win.Common.UI.error;
                        win.Common.UI.error = function(opts) {
                            if (isDownloadActive()) {
                                console.log('[Iframe] Suppressing Common.UI.error:', opts?.msg || opts);
                                if (opts && opts.callback) {
                                    setTimeout(() => opts.callback('ok'), 10);
                                }
                                return;
                            }
                            return originalUIError.apply(this, arguments);
                        };
                    }
                    
                    // Intercept window modal creation - this catches the actual error dialog
                    if (win.Common && win.Common.UI && win.Common.UI.Window) {
                        const OriginalWindow = win.Common.UI.Window;
                        
                        // Wrap the Window class to intercept modal creation
                        const wrappedWindow = function(options) {
                            // Check if this is an error/warning modal and download is active
                            if (isDownloadActive()) {
                                const title = options?.title?.toLowerCase() || '';
                                const msg = options?.msg?.toLowerCase() || '';
                                const iconCls = options?.iconCls || '';
                                
                                // Detect error/warning dialogs
                                if (title.includes('error') || title.includes('warning') || 
                                    msg.includes('error') || msg.includes('unknown') ||
                                    iconCls.includes('warn') || iconCls.includes('error')) {
                                    console.log('[Iframe] Blocking error Window creation:', options);
                                    // Return a dummy window object that does nothing
                                    return {
                                        show: function() { console.log('[Iframe] Dummy show()'); },
                                        hide: function() {},
                                        close: function() {},
                                        on: function() { return this; },
                                        off: function() { return this; },
                                        $window: { css: function(){}, is: function(){ return false; } }
                                    };
                                }
                            }
                            return new OriginalWindow(options);
                        };
                        
                        // Copy static properties
                        for (let prop in OriginalWindow) {
                            if (OriginalWindow.hasOwnProperty(prop)) {
                                wrappedWindow[prop] = OriginalWindow[prop];
                            }
                        }
                        wrappedWindow.prototype = OriginalWindow.prototype;
                        
                        win.Common.UI.Window = wrappedWindow;
                        console.log('[Iframe] Common.UI.Window interceptor installed');
                    }
                    
                    // Also try to intercept any showError/showWarning methods on controllers
                    try {
                        // Look for the main controller and intercept its error method
                        if (win.DE && win.DE.getController) {
                            const mainCtrl = win.DE.getController('Main');
                            if (mainCtrl && mainCtrl.onError) {
                                const origOnError = mainCtrl.onError.bind(mainCtrl);
                                mainCtrl.onError = function(id, level, errData) {
                                    if (isDownloadActive()) {
                                        console.log('[Iframe] Suppressing DE Main.onError:', id, level);
                                        return;
                                    }
                                    return origOnError(id, level, errData);
                                };
                                console.log('[Iframe] DE.Main.onError interceptor installed');
                            }
                        }
                    } catch(e) {
                        // Ignore errors accessing controllers
                    }
                    
                    // Retry if Common.UI is not fully loaded yet
                    if (!win.Common || !win.Common.UI || !win.Common.UI.alert) {
                        setTimeout(interceptAllErrorDialogs, 500);
                    }
                }
                
                // Start interception attempts
                interceptAllErrorDialogs();
                
                // Also retry multiple times as the UI loads
                setTimeout(interceptAllErrorDialogs, 1000);
                setTimeout(interceptAllErrorDialogs, 2000);
                setTimeout(interceptAllErrorDialogs, 5000);
                
                console.log('[Iframe XHR] Interceptor installed in iframe');
            } catch (e) {
                console.error('[Iframe XHR] Failed to install interceptor:', e);

        // Trigger file download from a URL
        async function triggerFileDownload(url) {
            try {
                console.log('[Download] ▶ triggerFileDownload called with:', url);
                updateStatus('Downloading file...');
                
                console.log('[Download] Fetching file from URL...');
                const response = await fetch(url);
                console.log('[Download] Fetch response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const blob = await response.blob();
                console.log('[Download] ✓ File fetched, size:', blob.size, 'bytes');
                
                // Extract filename from URL
                const urlPath = new URL(url).pathname;
                const filename = urlPath.split('/').pop() || 'download';
                console.log('[Download] Extracted filename:', filename);
                
                // Create download link and trigger it
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;
                console.log('[Download] Created download link, triggering click...');
                document.body.appendChild(a);
                a.click();
                console.log('[Download] ✓ Click triggered');
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);
                
                updateStatus(`Downloaded: ${filename}`);
                console.log('[Download] ✓ Successfully downloaded:', filename, blob.size, 'bytes');
                
                // Mark download as successful - keep error suppression window longer
                window._downloadSuccess = true;
                window._downloadSuccessTime = Date.now();
                console.log('[Download] Set success flags for error suppression');
                
                // Keep the download in progress flag for a bit longer to catch late errors
                setTimeout(() => {
                    window._downloadInProgress = false;
                    console.log('[Download] ✓ Download state cleared after 5s');
                }, 5000);
                
                return true;
            } catch (err) {
                console.error('[Download] Failed to fetch file:', err);
                updateStatus(`Download failed: ${err.message}`);
                // Still keep suppression active briefly in case of recovery
                setTimeout(() => {
                    window._downloadInProgress = false;
                }, 3000);
                return false;
            }
        }

        // Wait for templates to be loaded
        async function waitForTemplates() {
            if (templatesLoaded) return true;
            
            // Wait up to 5 seconds for templates
            for (let i = 0; i < 50; i++) {
                if (EmptyDocTemplates.word && EmptyDocTemplates.cell && EmptyDocTemplates.slide) {
                    templatesLoaded = true;
                    return true;
                }
                await new Promise(r => setTimeout(r, 100));
            }
            return false;
        }

        // Create document blob from template - as PLAIN TEXT (not decoded)
        // This matches how CryptPad does it in loadInitDocument()
        function createDocumentBlob(type) {
            const template = EmptyDocTemplates[type];
            if (!template) {
                console.error('No template for type:', type);
                return null;
            }
            console.log(`[Template] Creating ${type} blob with ${template.length} chars`);
            console.log(`[Template] Header: ${template.substring(0, 60)}`);
            // The template is used as-is as plain text, NOT base64 decoded
            // OnlyOffice expects this format: TYPE;version;size;base64data
            return new Blob([template], { type: 'text/plain' });
        }

        // Mock server implementation for CryptPad patched OnlyOffice
        // This simulates what would normally be a WebSocket connection to a document server
        function connectMockServer(editorInstance, docType, filename) {
            // Ensure window.APP exists (required by api.js)
            window.APP = window.APP || {};
            
            // Use the global user ID for consistency with editor config
            const myOOId = GLOBAL_USER_ID;
            console.log('[MockServer] User ID:', myOOId);
            
            // Store reference to send messages back to the editor
            let sendToEditor = null;
            // Store the current document binary for downloads
            window.currentDocumentBinary = null;
            
            const mockServer = {
                // Called when OnlyOffice sends a message (auth, save, etc.)
                onMessage: function(msg) {
                    console.log('[MockServer] Received message:', msg);
                    
                    // Handle different message types
                    if (msg.type === 'saveChanges') {
                        console.log('[MockServer] Save changes:', msg.changes?.length || 0, 'changes');
                        documentContent = msg.changes;
                        // Accumulate changes for export
                        if (msg.changes && Array.isArray(msg.changes)) {
                            documentChanges = documentChanges.concat(msg.changes);
                        }
                        // Acknowledge save
                        if (sendToEditor) {
                            sendToEditor({
                                type: 'saveChanges',
                                changesIndex: documentChanges.length,
                                locks: [],
                                excelAdditionalInfo: null
                            });
                        }
                    } else if (msg.type === 'unSaveLock') {
                        console.log('[MockServer] Unlock save');
                        if (sendToEditor) {
                            sendToEditor({
                                type: 'unSaveLock',

                // APP.printPdf - Called by CryptPad-patched OnlyOffice when generating PDF

                // OnlyOffice calls this as: window.parent.APP.printPdf(dataContainer, callback)
                window.APP.printPdf = function(dataContainer, callback) {
                    console.log('[PrintPdf] Called by OnlyOffice');
                    console.log('[PrintPdf] dataContainer:', dataContainer);
                    
                    if (!dataContainer || !dataContainer.data) {
                        console.error('[PrintPdf] No data in container');
                        callback && callback({ status: 'err' });
                        return;
                    }
                    
                    const pdfBinData = dataContainer.data;
                    console.log('[PrintPdf] pdf.bin size:', pdfBinData.byteLength || pdfBinData.length, 'bytes');
                    
                    // The pdf.bin from OnlyOffice contains the rendered PDF data
                    // We need to also get the document binary (.bin format)
                    // Since this is called from iframe context, we need to access the editor properly
                    
                    // Try multiple ways to find the editor
                    let api = null;
                    
                    // Method 1: Check if we're in an iframe and access parent's editor reference
                    if (window.editor) {
                        api = window.editor;
                        console.log('[PrintPdf] Found editor in window.editor');

                    // Method 2: Look in the iframe

                            console.log('[PrintPdf] Found editor in iframe');
                        }
                    }
                    
                    // Method 3: Check frames
                    if (!api && window.frames && window.frames.length > 0) {
                        for (let i = 0; i < window.frames.length; i++) {
                            try {
                                api = window.frames[i].Asc?.editor || window.frames[i].editor;

                                    break;
                                }
                            } catch (e) {}
                        }
                    }
                    
                    // Get document binary if we have an API
                    let docBin = null;
                    if (api) {
                        try {
                            if (api.asc_nativeGetFile) {
                                docBin = api.asc_nativeGetFile();
                                console.log('[PrintPdf] Got docBin via asc_nativeGetFile:', docBin?.length || docBin?.byteLength);

                            }
                        } catch (e) {
                            console.log('[PrintPdf] Error getting docBin:', e);
                        }
                    }
                    
                    // If we don't have docBin, we can still try with just pdf.bin
                    // The pdf.bin may be self-sufficient for some operations
                    
                    const filename = document.getElementById('filename')?.value || 'document';
                    
                    // Send to server
                    const formData = new FormData();
                    if (docBin) {
                        formData.append('docbin', new Blob([docBin]), 'document.bin');

                    formData.append('pdfbin', new Blob([pdfBinData]), 'pdf.bin');
                    formData.append('filename', filename);
                    
                    console.log('[PrintPdf] Sending to server - docBin:', docBin ? docBin.length || docBin.byteLength : 'none', 'pdfBin:', pdfBinData.length || pdfBinData.byteLength);
                    updateStatus('Generating PDF...');
                    
                    fetch('/api/print-pdf', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => {
                        if (!response.ok) throw new Error('Server error: ' + response.status);
                        return response.blob();

                    .then(pdfBlob => {

        // Fast single-user mode mock server - NO LOCK HANDLING

        function connectMockServerFast(editorInstance, docType, filename) {

            // STRATEGY: Tell editor that all locks belong to this user (so no lock visualization)
            // When IsThisElementLock sees the lock belongs to the current user, it won't draw it
            const mockServerFast = {
                // Receive messages from editor
                onMessage: function(msg) {
                    // Handle getLock by claiming the lock immediately for this user
                    // This tells the editor "you own this lock" so it won't draw lock indicators
                    if (msg.type === 'getLock') {
                        console.log('[MockServerFast] getLock - returning lock for this user');
                        // Build a locks object that says "this user owns all the blocks"
                        const blocks = msg.block || [];
                        const locks = {};
                        blocks.forEach(block => {
                            // Each lock entry says this user owns it
                            locks[JSON.stringify(block)] = {
                                block: block,
                                user: myOOId,
                                time: Date.now(),
                                sessionId: myOOId
                            };
                        });
                        sendMsg({
                            type: 'getLock',
                            locks: locks
                        });
                        return;
                    }
                    
                    // Release lock - just confirm it's released
                    if (msg.type === 'releaseLock') {
                        sendMsg({
                            type: 'releaseLock',
                            locks: {}
                        });
                        return;
                    }
                    
                    if (msg.type === 'saveChanges') {
                        sendMsg({
                            type: 'saveChanges',

                            excelAdditionalInfo: null
                        });
