<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyOffice Serverless Editor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f5f5f5; }
        .toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; }
        .toolbar button { padding: 8px 16px; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .toolbar button:hover { background: #f0f0f0; border-color: #ccc; }
        .toolbar button.primary { background: #0066cc; color: white; border-color: #0066cc; }
        .toolbar button.primary:hover { background: #0052a3; }
        .toolbar input[type="text"] { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 200px; }
        .toolbar .separator { width: 1px; height: 30px; background: #e0e0e0; margin: 0 5px; }
        .toolbar label { display: flex; align-items: center; gap: 5px; font-size: 14px; color: #666; cursor: pointer; }
        #editorContainer { flex: 1; position: relative; overflow: hidden; }
        #editor { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #666; }
        .spinner { width: 40px; height: 40px; border: 3px solid #f3f3f3; border-top: 3px solid #0066cc; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-bar { padding: 5px 20px; background: #fff; border-top: 1px solid #e0e0e0; font-size: 12px; color: #666; }
        #fileInput { display: none; }
        iframe { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="toolbar">
        <button class="primary" onclick="createDocument('word')">New Document</button>
        <button class="primary" onclick="createDocument('cell')">New Spreadsheet</button>
        <button class="primary" onclick="createDocument('slide')">New Presentation</button>
        <div class="separator"></div>
        <input type="file" id="fileInput" accept=".docx,.doc,.xlsx,.xls,.pptx,.ppt,.odt,.ods,.odp,.rtf,.txt,.csv,.html,.htm,.md" onchange="openFile(event)">
        <button onclick="document.getElementById('fileInput').click()">Open File</button>
        <button onclick="downloadDocument()">Download</button>
        <div class="separator"></div>
        <input type="text" id="filename" placeholder="Document name" value="Untitled">
    </div>
    <div id="editorContainer"><div id="editor"><div class="loading"><p>Click "New Document", "New Spreadsheet", or "New Presentation" to start</p></div></div></div>
    <div class="status-bar"><span id="status">Ready</span></div>

    <script src="/onlyoffice/v8/web-apps/apps/api/documents/api.js"></script>
    <script>
        // Service worker registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/onlyoffice/v8/document_editor_service_worker.js', { scope: '/onlyoffice/v8/' }).catch(() => {});
            navigator.serviceWorker.addEventListener('message', e => { if (e.data?.type === 'download-ready' && e.data.url) triggerFileDownload(e.data.url); });
        }

        // Global XHR interceptor
        (function() {
            const OrigXHR = XMLHttpRequest;
            XMLHttpRequest = function() {
                const xhr = new OrigXHR();
                const origOpen = xhr.open, origSend = xhr.send;
                xhr._isDownload = false;
                xhr.open = function(method, url) { xhr._isDownload = (method === 'POST' && url.includes('/downloadas/')); return origOpen.apply(this, arguments); };
                xhr.send = function(body) {
                    if (xhr._isDownload) {
                        const origHandler = xhr.onreadystatechange;
                        xhr.onreadystatechange = function() {
                            if (xhr.readyState === 4 && xhr.status === 200) { try { const r = JSON.parse(xhr.responseText); if (r.error === 0 && r.url) triggerFileDownload(r.url); } catch (e) {} }
                            if (origHandler) origHandler.apply(this, arguments);
                        };
                    }
                    return origSend.apply(this, arguments);
                };
                return xhr;
            };
        })();

        // Global Fetch interceptor
        (function() {
            const origFetch = window.fetch;
            window.fetch = function(url, config) {
                const urlStr = typeof url === 'string' ? url : url?.url;
                if (urlStr?.includes('/downloadas/')) {
                    return origFetch.apply(this, arguments).then(response => {
                        if (response.ok) response.clone().json().then(d => { if (d.error === 0 && d.url) triggerFileDownload(d.url); }).catch(() => {});
                        return response;
                    });
                }
                return origFetch.apply(this, arguments);
            };
        })();

        // Load templates via fetch (avoid AMD define issues)
        window.EmptyDocTemplates = { word: null, cell: null, slide: null };
        (async function() {
            const templates = [{ url: '/templates/oodoc_base.js', type: 'word' }, { url: '/templates/oocell_base.js', type: 'cell' }, { url: '/templates/ooslide_base.js', type: 'slide' }];
            for (const cfg of templates) {
                try {
                    const response = await fetch(cfg.url);
                    if (response.ok) {
                        const text = await response.text();
                        // Extract template string from: return 'DOCY;v5;...'
                        const match = text.match(/return\s*['"]([A-Z]+;v\d+;[^'"]+)['"]/);
                        if (match) EmptyDocTemplates[cfg.type] = match[1];
                    }
                } catch (e) {}
            }
        })();

        // Config
        const urlParams = new URLSearchParams(window.location.search);
        const coEditEnabled = urlParams.has('coedit');
        const GLOBAL_USER_ID = 'user_' + Math.random().toString(36).substr(2, 9);

        // Auto-load from URL
        if (urlParams.has('file')) {
            const fileParam = urlParams.get('file');
            setTimeout(async () => {
                try {
                    const fileUrl = fileParam.startsWith('http') ? fileParam : window.location.origin + fileParam;
                    const filename = fileParam.split('/').pop().replace(/\.[^/.]+$/, '') || 'Document';
                    document.getElementById('filename').value = filename;
                    const ext = fileParam.split('.').pop().toLowerCase();
                    const typeMap = { 'docx': 'word', 'doc': 'word', 'odt': 'word', 'rtf': 'word', 'txt': 'word', 'html': 'word', 'htm': 'word', 'md': 'word', 'xlsx': 'cell', 'xls': 'cell', 'ods': 'cell', 'csv': 'cell', 'pptx': 'slide', 'ppt': 'slide', 'odp': 'slide' };
                    const docType = typeMap[ext] || 'word';
                    destroyEditor();
                    document.getElementById('editor').innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading file from URL...</p></div>';
                    updateStatus(`Loading ${fileParam}...`);
                    const response = await fetch(fileUrl);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const arrayBuffer = await response.arrayBuffer();
                    updateStatus(`Converting ${filename}...`);
                    const convertResponse = await fetch('/api/open', { method: 'POST', headers: { 'Content-Type': 'application/octet-stream', 'X-File-Extension': ext }, body: arrayBuffer });
                    if (!convertResponse.ok) throw new Error(`Conversion failed: ${convertResponse.status}`);
                    const result = await convertResponse.json();
                    if (result.error) throw new Error(result.error);
                    currentDocumentImages = {};
                    if (result.images) for (const [name, dataUrl] of Object.entries(result.images)) currentDocumentImages[name] = dataUrl;
                    const docBlob = new Blob([result.data], { type: 'text/plain' });
                    const docUrl = URL.createObjectURL(docBlob);
                    window.pendingDocumentUrl = docUrl;
                    currentType = docType;
                    createEditorForOpenedFile(docType, filename, ext, docUrl);
                } catch (err) { alert('Failed to load file from URL: ' + err.message); document.getElementById('editor').innerHTML = '<div class="loading"><p style="color: red;">Failed to load file</p></div>'; updateStatus('Error loading file'); }
            }, 500);
        }

        // Custom iframe styles
        let customIframeStyles = '';
        fetch('/iframe-styles.css').then(r => r.ok ? r.text() : '').then(css => { customIframeStyles = css; }).catch(() => {});
        function injectCustomStyles(iframeWin) { if (!customIframeStyles || !iframeWin) return; try { const doc = iframeWin.document; const style = doc.createElement('style'); style.textContent = customIframeStyles; (doc.head || doc.documentElement).appendChild(style); } catch (e) {} }

        // Disable lock mechanism
        function disableLockMechanism(iframeWindow) {
            if (!iframeWindow) return;
            const tryPatch = () => {
                try {
                    const editor = iframeWindow.Asc?.editor, ac = iframeWindow.AscCommon;
                    if (editor?.WordControl?.m_oDrawingDocument) editor.WordControl.m_oDrawingDocument.IsLockObjectsEnable = false;
                    if (editor && 'isCoMarksDraw' in editor) editor.isCoMarksDraw = false;
                    if (ac?.CGraphics?.prototype) { ac.CGraphics.prototype.DrawLockParagraph = function() {}; ac.CGraphics.prototype.DrawLockObjectRect = function() {}; }
                    if (ac?.CollaborativeEditing?.prototype) { ac.CollaborativeEditing.prototype.Is_Fast = function() { return true; }; ac.CollaborativeEditing.prototype.getFast = function() { return true; }; ac.CollaborativeEditing.prototype.isLocked = function() { return false; }; ac.CollaborativeEditing.prototype.Is_SingleUser = function() { return true; }; }
                    if (ac?.g_oCollaborativeEditing) { const gCE = ac.g_oCollaborativeEditing; gCE.m_bFast = true; gCE.m_bSingleUser = true; gCE.Is_Fast = function() { return true; }; gCE.getFast = function() { return true; }; gCE.Is_SingleUser = function() { return true; }; gCE.isLocked = function() { return false; }; gCE.getLockInfo = function() { return null; }; gCE.Add_CheckLock = function() { return false; }; gCE.m_aLocks = []; gCE.m_aLocksToSend = []; }
                    if (editor?.collaborativeEditing) { editor.collaborativeEditing.m_bFast = true; editor.collaborativeEditing.m_bSingleUser = true; editor.collaborativeEditing.Is_Fast = function() { return true; }; editor.collaborativeEditing.getFast = function() { return true; }; editor.collaborativeEditing.Is_SingleUser = function() { return true; }; }
                    if (editor?.CoAuthoringApi) { editor.CoAuthoringApi.isLocked = function() { return false; }; editor.CoAuthoringApi.getLock = function() { return true; }; editor.CoAuthoringApi.releaseLock = function() {}; }
                    if (ac?.CDocument?.prototype) { ac.CDocument.prototype.IsSelectionLocked = function() { return false; }; ac.CDocument.prototype.Document_Is_SelectionLocked = function() { return false; }; }
                    if (ac?.CollaborativeEditing) ac.CollaborativeEditing.Add_CheckLock = function() { return false; };
                    if (ac?.CLock?.prototype) { ac.CLock.prototype.Check = function() { return false; }; ac.CLock.prototype.Get_Type = function() { return ac.c_oAscLockTypes?.kLockTypeNone || 0; }; }
                    if (iframeWindow.AscWord?.Paragraph?.prototype) iframeWindow.AscWord.Paragraph.prototype.Document_Is_SelectionLocked = function() { return false; };
                } catch (e) {}
            };
            tryPatch(); [100, 300, 500, 1000, 2000, 3000, 5000].forEach(t => setTimeout(tryPatch, t));
        }

        // State
        let editor = null, currentType = null, currentDocUrl = null, currentDocBlob = null, documentContent = null, documentChanges = [], templatesLoaded = false, currentDocumentImages = {};

        function destroyEditor() {
            if (currentDocUrl) { URL.revokeObjectURL(currentDocUrl); currentDocUrl = null; }
            if (editor) { try { if (typeof editor.destroyEditor === 'function') editor.destroyEditor(); } catch (e) {} editor = null; }
            const container = document.getElementById('editorContainer');
            if (container) { container.innerHTML = ''; const newEditorDiv = document.createElement('div'); newEditorDiv.id = 'editor'; container.appendChild(newEditorDiv); }
            currentDocBlob = null; documentContent = null; documentChanges = [];
        }

        function updateStatus(message) { document.getElementById('status').textContent = message; }
        function isDownloadActive() { return window._downloadInProgress || (window._downloadSuccess && (Date.now() - window._downloadSuccessTime < 10000)) || (window._downloadStartTime && (Date.now() - window._downloadStartTime < 15000)); }

        function injectDownloadInterceptor(win) {
            try {
                const origOpen = win.XMLHttpRequest.prototype.open, origSend = win.XMLHttpRequest.prototype.send;
                win.XMLHttpRequest.prototype.open = function(method, url) { this._isDownload = (method === 'POST' && url.includes('/downloadas/')); return origOpen.apply(this, arguments); };
                win.XMLHttpRequest.prototype.send = function(body) {
                    if (this._isDownload) { const xhr = this, origHandler = xhr.onreadystatechange; xhr.onreadystatechange = function() { if (xhr.readyState === 4 && xhr.status === 200) { try { const r = JSON.parse(xhr.responseText); if (r.error === 0 && r.url) { window._downloadInProgress = true; window._downloadStartTime = Date.now(); window.triggerFileDownload(r.url); } } catch (e) {} } if (origHandler) origHandler.apply(this, arguments); }; }
                    return origSend.apply(this, arguments);
                };
                const origAlert = win.alert; win.alert = function(msg) { if (isDownloadActive()) return; return origAlert.apply(this, arguments); };
                interceptAllErrorDialogs(win);
            } catch (e) {}
        }

        function interceptAllErrorDialogs(win) {
            if (win.Common?.UI?.alert) { const orig = win.Common.UI.alert; win.Common.UI.alert = function(opts) { if (isDownloadActive()) { if (opts?.callback) setTimeout(() => opts.callback('ok'), 10); return; } return orig.apply(this, arguments); }; }
            if (win.Common?.UI?.warning) { const orig = win.Common.UI.warning; win.Common.UI.warning = function(opts) { if (isDownloadActive()) { if (opts?.callback) setTimeout(() => opts.callback('ok'), 10); return; } return orig.apply(this, arguments); }; }
            if (win.Common?.UI?.error) { const orig = win.Common.UI.error; win.Common.UI.error = function(opts) { if (isDownloadActive()) { if (opts?.callback) setTimeout(() => opts.callback('ok'), 10); return; } return orig.apply(this, arguments); }; }
            if (win.Common?.UI?.Window) {
                const OrigWin = win.Common.UI.Window;
                const wrapped = function(opts) { if (isDownloadActive()) { const t = opts?.title?.toLowerCase() || '', m = opts?.msg?.toLowerCase() || '', i = opts?.iconCls || ''; if (t.includes('error') || t.includes('warning') || m.includes('error') || m.includes('unknown') || i.includes('warn') || i.includes('error')) return { show: function() {}, hide: function() {}, close: function() {}, on: function() { return this; }, off: function() { return this; }, $window: { css: function(){}, is: function(){ return false; } } }; } return new OrigWin(opts); };
                for (let p in OrigWin) if (OrigWin.hasOwnProperty(p)) wrapped[p] = OrigWin[p]; wrapped.prototype = OrigWin.prototype; win.Common.UI.Window = wrapped;
            }
            try { if (win.DE?.getController) { const ctrl = win.DE.getController('Main'); if (ctrl?.onError) { const orig = ctrl.onError.bind(ctrl); ctrl.onError = function(id, lvl, err) { if (isDownloadActive()) return; return orig(id, lvl, err); }; } } } catch(e) {}
            if (!win.Common?.UI?.alert) setTimeout(() => interceptAllErrorDialogs(win), 500);
        }

        async function triggerFileDownload(url) {
            try {
                updateStatus('Downloading file...');
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                const blob = await response.blob();
                const urlPath = new URL(url).pathname;
                const filename = urlPath.split('/').pop() || 'download';
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = downloadUrl; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(downloadUrl);
                updateStatus(`Downloaded: ${filename}`);
                window._downloadSuccess = true; window._downloadSuccessTime = Date.now();
                setTimeout(() => { window._downloadInProgress = false; }, 5000);
                return true;
            } catch (err) { updateStatus(`Download failed: ${err.message}`); setTimeout(() => { window._downloadInProgress = false; }, 3000); return false; }
        }

        async function waitForTemplates() { if (templatesLoaded) return true; for (let i = 0; i < 50; i++) { if (EmptyDocTemplates.word && EmptyDocTemplates.cell && EmptyDocTemplates.slide) { templatesLoaded = true; return true; } await new Promise(r => setTimeout(r, 100)); } return false; }
        function createDocumentBlob(type) { const t = EmptyDocTemplates[type]; return t ? new Blob([t], { type: 'text/plain' }) : null; }

        async function createDocument(type) {
            currentType = type;
            const filename = document.getElementById('filename').value || 'Untitled';
            destroyEditor();
            document.getElementById('editor').innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading editor...</p></div>';
            updateStatus(`Creating ${type} document...`);
            const loaded = await waitForTemplates();
            if (!loaded) { updateStatus('Error: Templates failed to load'); document.getElementById('editor').innerHTML = '<div class="loading"><p style="color: red;">Error: Failed to load document templates</p></div>'; return; }
            const blob = createDocumentBlob(type);
            if (!blob) { updateStatus('Error: Failed to create document'); return; }
            currentDocBlob = blob; currentDocUrl = URL.createObjectURL(blob);
            const extMap = { word: 'docx', cell: 'xlsx', slide: 'pptx' };
            const fileType = extMap[type] || 'docx';
            const config = {
                documentType: type === 'cell' ? 'spreadsheet' : type === 'slide' ? 'presentation' : 'word',
                document: { fileType: fileType, key: 'doc_' + Date.now().toString(), title: `${filename}.${fileType}`, url: currentDocUrl, permissions: { edit: true, download: true, print: true, review: false, comment: false } },
                editorConfig: { mode: 'edit', lang: 'en', user: { id: GLOBAL_USER_ID, name: 'Guest' }, coEditing: { mode: 'fast', change: false }, customization: { autosave: false, forcesave: false, chat: false, comments: false, compactHeader: true, compactToolbar: false, help: false, hideRightMenu: false, about: false, feedback: false } },
                events: {
                    onAppReady: function() { updateStatus('Editor ready, loading document...'); setupIframe(); },
                    onDocumentReady: function() { updateStatus(`Ready • Editing ${filename}.${fileType}`); if (!coEditEnabled) { const iframe = document.querySelector('#editor iframe'); if (iframe?.contentWindow) disableLockMechanism(iframe.contentWindow); } },
                    onError: function(e) { if (!isDownloadActive()) updateStatus(`Error: ${e.data || JSON.stringify(e)}`); },
                    onWarning: function(e) { if (e?.data?.warningCode === -1 || isDownloadActive()) return; if (e?.data) { const url = e.data.url || e.data.data?.url; if (url) triggerFileDownload(url); } },
                    onDownloadAs: function(e) { window._downloadInProgress = true; window._downloadStartTime = Date.now(); if (e?.data) { const url = typeof e.data === 'string' ? e.data : e.data.url; if (url) triggerFileDownload(url); } },
                    onRequestSaveAs: function() { window._downloadInProgress = true; window._downloadStartTime = Date.now(); downloadDocument(); },
                    onRequestSave: function() { window._downloadInProgress = true; window._downloadStartTime = Date.now(); downloadDocument(); }
                },
                type: 'desktop', width: '100%', height: '100%'
            };
            try {
                document.getElementById('editor').innerHTML = '';
                editor = new DocsAPI.DocEditor('editor', config);
                setTimeout(() => patchIframe(), 1000);
                if (editor.connectMockServer) { if (coEditEnabled) connectMockServer(editor, type, filename); else connectMockServerFast(editor, type, filename); }
            } catch (err) { updateStatus(`Failed to create editor: ${err.message}`); document.getElementById('editor').innerHTML = `<div class="loading"><p style="color: red;">Error: ${err.message}</p></div>`; }
        }

        function setupIframe() { try { const iframe = document.querySelector('#editor iframe'); if (iframe) { iframe.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:none;'; if (iframe.contentWindow) injectDownloadInterceptor(iframe.contentWindow); } } catch (e) {} }

        function patchIframe(attempt = 0) {
            if (attempt > 20) return;
            try {
                const editorFrame = document.querySelector('#editor iframe');
                if (editorFrame?.contentWindow) {
                    const iframeWin = editorFrame.contentWindow;
                    if (iframeWin.fetch && !iframeWin._fetchPatched) { const origFetch = iframeWin.fetch; iframeWin.fetch = function(...args) { const url = typeof args[0] === 'string' ? args[0] : args[0]?.url; if (url?.includes('/downloadas/')) { window._downloadInProgress = true; window._downloadStartTime = Date.now(); pollForDownload(); } return origFetch.apply(this, args); }; iframeWin._fetchPatched = true; }
                    if (iframeWin.XMLHttpRequest && !iframeWin._xhrPatched) {
                        const OrigXHR = iframeWin.XMLHttpRequest;
                        iframeWin.XMLHttpRequest = function() { const xhr = new OrigXHR(); const origOpen = xhr.open, origSend = xhr.send; let isDownloadReq = false; xhr.open = function(method, url, ...rest) { if (method === 'POST' && url.includes('/downloadas/')) { isDownloadReq = true; window._downloadInProgress = true; window._downloadStartTime = Date.now(); pollForDownload(); } return origOpen.call(this, method, url, ...rest); }; xhr.send = function(...args) { if (isDownloadReq && window.parent._pendingDownloadFilename) { try { xhr.setRequestHeader('X-Override-Filename', window.parent._pendingDownloadFilename); } catch (e) {} } return origSend.apply(this, args); }; return xhr; };
                        iframeWin._xhrPatched = true;
                    }
                    injectCustomStyles(iframeWin);
                    if (!coEditEnabled) disableLockMechanism(iframeWin);
                } else setTimeout(() => patchIframe(attempt + 1), 500);
            } catch (err) { setTimeout(() => patchIframe(attempt + 1), 500); }
        }

        // Shared APP hooks
        function setupAPPHooks(sendToEditor) {
            window.APP = window.APP || {};
            window.APP.UploadImageFiles = function(files, type, id, jwt, cb) { if (!files || files.length === 0) { cb && cb(); return; } const processFile = (file, idx) => { const reader = new FileReader(); reader.onload = function(e) { try { const blob = new Blob([e.target.result], { type: file.type }); const blobUrl = URL.createObjectURL(blob); const ext = file.name.split('.').pop() || 'png'; const imageName = `image_upload_${Date.now()}_${idx}.${ext}`; try { const iframe = document.querySelector('#editor iframe'); if (iframe?.contentWindow?.AscCommon?.g_oDocumentUrls) iframe.contentWindow.AscCommon.g_oDocumentUrls.addImageUrl(imageName, blobUrl); } catch (err) {} cb && cb(); } catch (err) { cb && cb(); } }; reader.readAsArrayBuffer(file); }; for (let i = 0; i < files.length; i++) processFile(files[i], i); };
            window.APP.AddImage = function(successCb, errorCb) { const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.style.display = 'none'; input.onchange = function(e) { const file = e.target.files[0]; if (!file) { errorCb && errorCb('No file selected'); document.body.removeChild(input); return; } const reader = new FileReader(); reader.onload = function(evt) { try { const dataUrl = evt.target.result; const imageName = 'image_' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '_'); currentDocumentImages[imageName] = dataUrl; const iframe = document.querySelector('#editor iframe'); if (iframe?.contentWindow?.AscCommon?.g_oDocumentUrls) iframe.contentWindow.AscCommon.g_oDocumentUrls.addImageUrl(imageName, dataUrl); successCb && successCb({ name: imageName, url: dataUrl }); } catch (err) { errorCb && errorCb(err.message); } }; reader.onerror = function() { errorCb && errorCb('Failed to read file'); }; reader.readAsDataURL(file); document.body.removeChild(input); }; input.oncancel = function() { document.body.removeChild(input); }; document.body.appendChild(input); input.click(); };
            window.APP.AddImageUrl = function(url, successCb, errorCb) { const img = new Image(); img.crossOrigin = 'anonymous'; img.onload = function() { try { const canvas = document.createElement('canvas'); canvas.width = img.naturalWidth; canvas.height = img.naturalHeight; canvas.getContext('2d').drawImage(img, 0, 0); const dataUrl = canvas.toDataURL('image/png'); const imageName = 'image_url_' + Date.now(); currentDocumentImages[imageName] = dataUrl; const iframe = document.querySelector('#editor iframe'); if (iframe?.contentWindow?.AscCommon?.g_oDocumentUrls) iframe.contentWindow.AscCommon.g_oDocumentUrls.addImageUrl(imageName, dataUrl); successCb && successCb({ name: imageName, url: dataUrl }); } catch (err) { errorCb && errorCb(err.message); } }; img.onerror = function() { fetch('/api/fetch-image?url=' + encodeURIComponent(url)).then(r => r.json()).then(data => { if (data.dataUrl) { const imageName = 'image_url_' + Date.now(); currentDocumentImages[imageName] = data.dataUrl; const iframe = document.querySelector('#editor iframe'); if (iframe?.contentWindow?.AscCommon?.g_oDocumentUrls) iframe.contentWindow.AscCommon.g_oDocumentUrls.addImageUrl(imageName, data.dataUrl); successCb && successCb({ name: imageName, url: data.dataUrl }); } else errorCb && errorCb('Failed to fetch image'); }).catch(err => { errorCb && errorCb('CORS error: ' + err.message); }); }; img.src = url; };
            window.APP.printPdf = function(dataContainer, cb) {
                const pdfBinData = dataContainer?.data;
                if (!pdfBinData) { cb && cb({ status: 'err' }); return; }
                
                // Check if it's already a PDF (starts with %PDF)
                const header = pdfBinData instanceof ArrayBuffer ? new Uint8Array(pdfBinData.slice(0, 4)) : (pdfBinData.slice ? pdfBinData.slice(0, 4) : null);
                const isPdf = header && String.fromCharCode(...header) === '%PDF';
                
                // Try to get docBin from multiple sources
                let docBin = window.currentDocumentBinary;
                if (!docBin) {
                    // Try getting from editor API
                    try {
                        const iframe = document.querySelector('#editor iframe');
                        const api = iframe?.contentWindow?.Asc?.editor;
                        if (api?.asc_nativeGetFile) docBin = api.asc_nativeGetFile();
                        else if (api?.asc_nativeGetFileData) docBin = api.asc_nativeGetFileData();
                    } catch (e) {}
                }
                
                const filename = document.getElementById('filename')?.value || 'document';
                
                // If not a complete PDF and no docBin, show message
                if (!isPdf && !docBin) { 
                    updateStatus('PDF generation requires document data - please make an edit first'); 
                    cb && cb({ status: 'err' }); 
                    return; 
                }
                
                const formData = new FormData();
                if (docBin) formData.append('docbin', new Blob([docBin]), 'document.bin');
                formData.append('pdfbin', new Blob([pdfBinData]), 'pdf.bin');
                formData.append('filename', filename);
                updateStatus('Generating PDF...');
                
                fetch('/api/print-pdf', { method: 'POST', body: formData })
                    .then(r => { if (!r.ok) throw new Error('Server error: ' + r.status); return r.blob(); })
                    .then(pdfBlob => { 
                        updateStatus('PDF ready!'); 
                        const url = URL.createObjectURL(pdfBlob); 
                        const a = document.createElement('a'); 
                        a.href = url; 
                        a.download = filename + '.pdf'; 
                        document.body.appendChild(a); 
                        a.click(); 
                        document.body.removeChild(a); 
                        setTimeout(() => URL.revokeObjectURL(url), 1000); 
                        cb && cb({ status: 'ok' }); 
                    })
                    .catch(err => { 
                        updateStatus('PDF generation failed: ' + err.message); 
                        cb && cb({ status: 'err' }); 
                    });
            };
            window.APP.changeTheme = function(indexTheme) {};
        }

        // Mock server (co-edit mode)
        function connectMockServer(editorInstance, docType, filename) {
            window.APP = window.APP || {};
            const myOOId = GLOBAL_USER_ID;
            let sendToEditor = null;
            window.currentDocumentBinary = null;
            const mockServer = {
                onMessage: function(msg) {
                    if (msg.type === 'saveChanges') { documentContent = msg.changes; if (msg.changes && Array.isArray(msg.changes)) documentChanges = documentChanges.concat(msg.changes); if (sendToEditor) sendToEditor({ type: 'saveChanges', changesIndex: documentChanges.length, locks: [], excelAdditionalInfo: null }); }
                    else if (msg.type === 'unSaveLock') { if (sendToEditor) sendToEditor({ type: 'unSaveLock', index: -1 }); }
                    else if (msg.type === 'getLock') { if (sendToEditor) { const locks = {}; if (msg.block && Array.isArray(msg.block)) msg.block.forEach(block => { const key = typeof block === 'object' ? JSON.stringify(block) : String(block); locks[key] = { visitable: true, block: block, user: myOOId, time: Date.now(), changes: null }; }); sendToEditor({ type: 'getLock', locks: locks }); } }
                    else if (msg.type === 'isSaveLock') { if (sendToEditor) sendToEditor({ type: 'saveLock', saveLock: false }); }
                    else if (msg.type === 'openDocument' && msg.message?.c === 'imgurls') { if (sendToEditor) sendToEditor({ type: 'documentOpen', data: { "imgurls": {} } }); }
                },
                getParticipants: function() { return { list: [{ id: myOOId, idOriginal: myOOId, username: 'Guest', indexUser: 0, view: false, connectionId: myOOId }], index: 0 }; },
                onAuth: function() { updateStatus(`Ready • Editing ${filename}`); },
                getImageURL: function(name) { if (name.startsWith('blob:') || name.startsWith('data:') || name.startsWith('http')) return Promise.resolve(name); if (currentDocumentImages[name]) return Promise.resolve(currentDocumentImages[name]); return Promise.resolve(`/onlyoffice/v8/web-apps/apps/documenteditor/main/${name}`); },
                getInitialChanges: function() { return []; },
                onDocumentBinaryReady: function(binary) { window.currentDocumentBinary = binary; }
            };
            try { sendToEditor = editorInstance.connectMockServer(mockServer); setupAPPHooks(sendToEditor); } catch (err) {}
        }

        // Fast mock server (single-user mode)
        function connectMockServerFast(editorInstance, docType, filename) {
            window.APP = window.APP || {};
            const myOOId = GLOBAL_USER_ID;
            const editorComm = { send: null };
            window.currentDocumentBinary = null;
            function sendMsg(msg) { if (editorComm.send) editorComm.send(msg); }
            const mockServerFast = {
                onMessage: function(msg) {
                    if (msg.type === 'getLock') { const blocks = msg.block || []; const locks = {}; blocks.forEach(block => { locks[JSON.stringify(block)] = { block: block, user: myOOId, time: Date.now(), sessionId: myOOId }; }); sendMsg({ type: 'getLock', locks: locks }); }
                    else if (msg.type === 'releaseLock') { sendMsg({ type: 'releaseLock', locks: {} }); }
                    else if (msg.type === 'saveChanges') { sendMsg({ type: 'saveChanges', changesIndex: 0, locks: [], excelAdditionalInfo: null }); }
                    else if (msg.type === 'unSaveLock') { sendMsg({ type: 'unSaveLock', index: -1 }); }
                    else if (msg.type === 'isSaveLock') { sendMsg({ type: 'saveLock', saveLock: false }); }
                    else if (msg.type === 'openDocument' && msg.message?.c === 'imgurls') { sendMsg({ type: 'documentOpen', data: { "imgurls": {} } }); }
                },
                getParticipants: function() { return { list: [], index: -1 }; },
                onAuth: function() { updateStatus(`Ready • Editing ${filename}`); if (window.APP?.onFastChange) window.APP.onFastChange(true); },
                getImageURL: function(name) { if (name.startsWith('blob:') || name.startsWith('data:') || name.startsWith('http')) return Promise.resolve(name); if (currentDocumentImages[name]) return Promise.resolve(currentDocumentImages[name]); return Promise.resolve(`/onlyoffice/v8/web-apps/apps/documenteditor/main/${name}`); },
                getInitialChanges: function() { return []; },
                onDocumentBinaryReady: function(binary) { window.currentDocumentBinary = binary; }
            };
            try { editorComm.send = editorInstance.connectMockServer(mockServerFast); window.APP.onFastChange = function(isFast) { window.APP.isFast = true; }; window.APP.isFast = true; setupAPPHooks(editorComm.send); } catch (err) {}
        }

        async function openFile(event) {
            const file = event.target.files[0]; if (!file) return;
            const ext = file.name.split('.').pop().toLowerCase();
            const typeMap = { 'docx': 'word', 'doc': 'word', 'odt': 'word', 'rtf': 'word', 'txt': 'word', 'html': 'word', 'htm': 'word', 'md': 'word', 'xlsx': 'cell', 'xls': 'cell', 'ods': 'cell', 'csv': 'cell', 'pptx': 'slide', 'ppt': 'slide', 'odp': 'slide' };
            const docType = typeMap[ext];
            if (!docType) { alert('Unsupported file type: ' + ext + '\n\nSupported formats:\n• Word: docx, doc, rtf, txt, html, md\n• Excel: xlsx, xls, ods, csv\n• PowerPoint: pptx, ppt'); return; }
            const filename = file.name.replace(/\.[^/.]+$/, '');
            document.getElementById('filename').value = filename;
            destroyEditor();
            document.getElementById('editor').innerHTML = '<div class="loading"><div class="spinner"></div><p>Converting document...</p></div>';
            updateStatus(`Converting ${file.name}...`);
            try {
                const arrayBuffer = await file.arrayBuffer();
                const response = await fetch('/api/open', { method: 'POST', headers: { 'Content-Type': 'application/octet-stream', 'X-File-Extension': ext }, body: arrayBuffer });
                if (!response.ok) throw new Error(`Server error: ${response.status}`);
                const result = await response.json();
                if (result.error) throw new Error(result.error);
                const docBlob = new Blob([result.data], { type: 'text/plain' });
                const docUrl = URL.createObjectURL(docBlob);
                currentDocumentImages = {};
                if (result.images) for (const [name, dataUrl] of Object.entries(result.images)) currentDocumentImages[name] = dataUrl;
                window.pendingDocumentUrl = docUrl;
                currentType = docType;
                createEditorForOpenedFile(docType, filename, ext, docUrl);
            } catch (err) { alert('Failed to open file: ' + err.message); destroyEditor(); document.getElementById('editor').innerHTML = '<div class="loading"><p style="color: #666;">Click a button above to create a new document</p></div>'; updateStatus('Failed to open file'); }
            event.target.value = '';
        }

        function createEditorForOpenedFile(type, filename, fileType, documentUrl) {
            document.getElementById('editor').innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading document...</p></div>';
            updateStatus(`Opening ${filename}.${fileType}...`);
            const extMap = { word: 'docx', cell: 'xlsx', slide: 'pptx' };
            const defaultExt = extMap[type] || 'docx';
            const config = {
                documentType: type === 'cell' ? 'spreadsheet' : type === 'slide' ? 'presentation' : 'word',
                document: { fileType: defaultExt, key: 'doc_' + Date.now().toString(), title: `${filename}.${fileType || defaultExt}`, url: documentUrl, permissions: { edit: true, download: true, print: true } },
                editorConfig: { mode: 'edit', lang: 'en', user: { id: GLOBAL_USER_ID, name: 'Guest' }, coEditing: { mode: 'fast', change: false }, customization: { autosave: false, forcesave: false, chat: false, comments: false, compactHeader: true, help: false, about: false, feedback: false } },
                events: {
                    onAppReady: function() { setupIframe(); },
                    onDocumentReady: function() { updateStatus(`Ready • Editing ${filename}.${fileType || defaultExt}`); if (window.pendingDocumentUrl) { URL.revokeObjectURL(window.pendingDocumentUrl); window.pendingDocumentUrl = null; } if (!coEditEnabled) { const iframe = document.querySelector('#editor iframe'); if (iframe?.contentWindow) disableLockMechanism(iframe.contentWindow); } },
                    onError: function(e) { if (!window._downloadInProgress) updateStatus('Error: ' + (e.data?.errorDescription || 'Unknown error')); }
                }
            };
            editor = new DocsAPI.DocEditor('editor', config);
            setTimeout(() => patchIframe(), 1000);
            if (coEditEnabled) connectMockServer(editor, type, filename); else connectMockServerFast(editor, type, filename);
        }

        function loadDocumentInEditor(type, filename, fileType, documentUrl) { createEditorForOpenedFile(type, filename, fileType, documentUrl); }

        async function downloadDocument() {
            if (!editor) { alert('Please create or open a document first'); return; }
            const filename = document.getElementById('filename').value || 'Untitled';
            const extMap = { word: 'docx', cell: 'xlsx', slide: 'pptx' };
            const ext = extMap[currentType] || 'docx';
            updateStatus(`Downloading ${filename}.${ext}...`);
            window._downloadInProgress = true; window._downloadStartTime = Date.now(); window._downloadSuccess = false; window._pendingDownloadFilename = `${filename}.${ext}`;
            try { editor.downloadAs(`${filename}.${ext}`); pollForDownload(); } catch (err) { updateStatus('Download failed: ' + err.message); setTimeout(() => { window._downloadInProgress = false; }, 5000); }
        }

        function saveAsFormat(format) {
            if (!editor) { alert('Please create or open a document first'); return; }
            const filename = document.getElementById('filename').value || 'Untitled';
            updateStatus(`Downloading ${filename}.${format}...`);
            window._downloadInProgress = true; window._downloadStartTime = Date.now(); window._pendingDownloadFilename = `${filename}.${format}`;
            try { editor.downloadAs(`${filename}.${format}`); pollForDownload(); } catch (err) { window._downloadInProgress = false; }
        }

        async function pollForDownload() {
            let attempts = 0;
            const poll = async () => {
                try {
                    const response = await fetch('/api/latest-download');
                    const data = await response.json();
                    if (data.url) { await triggerFileDownload(data.url); return; }
                    if (++attempts < 30) setTimeout(poll, 500);
                    else { updateStatus('Download timed out'); setTimeout(() => { window._downloadInProgress = false; }, 3000); }
                } catch (err) { setTimeout(() => { window._downloadInProgress = false; }, 3000); }
            };
            setTimeout(poll, 500);
        }

        function downloadInternalFormat(filename) {
            const template = EmptyDocTemplates[currentType];
            if (!template) { alert('Cannot export: no template available'); return; }
            let exportData = template;
            if (documentChanges?.length > 0) exportData += '\n' + JSON.stringify({ changes: documentChanges });
            const blob = new Blob([exportData], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `${filename}.bin`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            updateStatus(`Downloaded ${filename}.bin (internal format)`);
        }

        updateStatus('Ready • Click "New Document", "New Spreadsheet", or "New Presentation" to start');
    </script>
